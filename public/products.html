<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全部产品 · 已采集</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e4e7ec;--text:#111827;--muted:#6b7280;--bundle:#b42318;--normal:#067647;--info:#175cd3;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:18px 24px 6px}h1{margin:0 0 6px;font-size:19px}.sub{color:var(--muted);font-size:13px;margin:0 0 8px;max-width:1200px}
.nav{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin:6px 0 2px}
.nav a{color:var(--info);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px}
.nav a:hover{border-color:#98a2b3}.nav a.on{background:var(--text);color:#fff;border-color:var(--text)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:8px 0}
.stats b{font-size:16px}.stats .b{color:var(--bundle)}.stats .n{color:var(--normal)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);padding:10px 24px;z-index:5;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13px;color:var(--text)}
.tabs button.on{background:var(--text);color:#fff;border-color:var(--text)}
.tabs .label{font-size:12px;color:var(--muted)}
#search{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;min-width:240px;outline:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 24px 2px;max-width:1500px;margin:0 auto}
.filters .label{font-size:12px;color:var(--muted)}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px;color:var(--text)}
.filters button.on{background:var(--info);border-color:var(--info);color:#fff}
.filters .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.bundle-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px}
.bbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 9px;font-size:11.5px;cursor:pointer;color:var(--text)}
.bbtn:hover{border-color:#98a2b3}
.bbtn.on.red{background:var(--bundle);border-color:var(--bundle);color:#fff}
.bbtn.on.green{background:var(--normal);border-color:var(--normal);color:#fff}
.bbtn.on.gray{background:#475467;border-color:#475467;color:#fff}
.bstate{font-size:11.5px;color:var(--muted)}
.split-toggle{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 9px;font-size:11.5px;cursor:pointer}
.split-toggle:hover{border-color:#98a2b3}
.split-panel{background:#fbfcfe;border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:12px 14px;margin-top:-9px}
.sp-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.sp-head b{font-size:13.5px}
.sp-head button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
.sp-head button:hover{border-color:#98a2b3}
.sp-status{font-size:12px;color:var(--muted)}
.sp-products{display:flex;flex-direction:column;gap:8px}
.sp-product{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px}
.sp-title{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.sp-title b{font-size:12.5px}
.sp-title input{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;min-width:220px}
.sp-row{display:flex;gap:8px;align-items:flex-start;margin-top:5px}
.sp-label{font-size:11px;font-weight:700;color:var(--muted);min-width:40px;padding-top:6px;flex:none}
.sp-opts{display:flex;flex-wrap:wrap;gap:6px}
.sp-opt{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:2px 6px 2px 3px;font-size:12px;background:#fff;max-width:100%}
.sp-opt img{width:26px;height:26px;object-fit:cover;border-radius:4px;display:block;background:#f2f4f7}
.sp-opt select{border:1px solid var(--line);border-radius:4px;font-size:11px;padding:1px 2px;background:#fff;max-width:80px}
.sp-ignored .sp-opt{opacity:.7}
.sp-imgs{display:flex;flex-wrap:wrap;gap:6px}
.sp-img{width:94px;border:1px solid var(--line);border-radius:6px;padding:3px;background:#fff}
.sp-img img{width:86px;height:86px;object-fit:cover;border-radius:4px;display:block;background:#f2f4f7}
.sp-assign{display:flex;gap:3px;justify-content:center;margin-top:3px;flex-wrap:wrap}
.sp-assign button{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:10.5px;cursor:pointer;line-height:1;padding:0}
.sp-assign button.on{background:var(--info);border-color:var(--info);color:#fff}
.sp-pub-img{position:relative;cursor:grab}
.sp-pub-img.dragging{opacity:.4}
.sp-pub-img.drop-before{box-shadow:-3px 0 0 var(--info)}
.sp-pub-img.drop-after{box-shadow:3px 0 0 var(--info)}
.sp-pub-x{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:10px;line-height:1;padding:0;cursor:pointer;z-index:1}
.sp-imgs.picking-swatch .sp-pub-img{outline:2px dashed var(--info);cursor:crosshair}
.sp-imgs.adding-publish .sp-img[data-assign-ref]{outline:2px dashed var(--info);cursor:copy}
.sp-pub-save{padding:2px 10px;font-size:11px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer}
.sp-pub-save:disabled{opacity:.6;cursor:default}
.pp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pp-chip{font-size:11.5px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);background:#fff;color:var(--text)}
.pp-chip.ok{background:#ecfdf3;border-color:#a6f4c5;color:#067647}
.pp-chip.warn{background:#fffaeb;border-color:#fedf89;color:#b54708}
.pp-chip.bad{background:#fef3f2;border-color:#fecdca;color:#b42318}
.pp-chip.info{background:#eff8ff;border-color:#b2ddff;color:#175cd3}
.pp-chip.gray{background:#f2f4f7;border-color:#e4e7ec;color:#475467}
.pp-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px}
@media(max-width:1100px){.pp-grid{grid-template-columns:1fr}}
.pp-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;min-width:0}
.pp-card.pp-wide{grid-column:1 / -1}
.pp-card-title{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pp-title{font-size:13.5px;font-weight:600;line-height:1.4}
.pp-desc{font-size:12.5px;color:#344054;line-height:1.5;margin-top:4px}
.pp-table{width:100%;border-collapse:collapse;font-size:12px}
.pp-table th,.pp-table td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.pp-table th{color:var(--muted);font-weight:600;font-size:11px}
.pp-table tr:last-child td{border-bottom:none}
.pp-swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pp-swatch{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px 2px 3px;font-size:12px;background:#fff}
.pp-swatch img{width:26px;height:26px;object-fit:cover;border-radius:4px;display:block;background:#f2f4f7}
.pp-thumbs{display:flex;flex-wrap:wrap;gap:5px}
.pp-thumbs img{width:52px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#f2f4f7;display:block}
.pp-muted{font-size:12px;color:var(--muted)}
.pp-tags{display:flex;flex-wrap:wrap;gap:5px}
.pp-tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:#fff;color:var(--text)}
.pp-tag.cat{background:#eff8ff;border-color:#b2ddff;color:#175cd3}
main{display:flex;flex-direction:column;gap:8px;padding:14px 24px 48px;max-width:1500px;margin:0 auto}
.row{display:grid;grid-template-columns:96px 200px minmax(0,1fr) 260px;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;align-items:start}
.row.is-bundle{border-left:4px solid var(--bundle)}
.cover{width:96px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#f2f4f7;display:block}
.meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.badge{align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff}
.badge.bundle{background:var(--bundle)}
.badge.normal{background:var(--normal)}
.badge.wp{background:var(--normal);font-weight:600}
.badge.wpdraft{background:#b54708;font-weight:600}
.badge.wpnone{background:#98a2b3;font-weight:600}
.badge.listing{background:var(--normal);font-weight:600}
.badge.delisted{background:#667085;font-weight:600}
.badge.unknown{background:#e4e7ec;color:#475467;font-weight:600}
.filters select{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:#fff;color:var(--text);max-width:280px;outline:none}
.meta .style{font-weight:700;font-size:13.5px}
.meta .muted{font-size:12px;color:var(--muted);word-break:break-all}
.body{display:flex;flex-direction:column;gap:6px;min-width:0}
.title{font-size:13.5px;font-weight:600;line-height:1.4}
.dims{display:flex;flex-direction:column;gap:4px}
.dim{display:flex;gap:8px;align-items:flex-start}
.dim-name{font-size:11px;font-weight:700;color:var(--muted);min-width:34px;padding-top:6px;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:2px 8px 2px 3px;background:#fff;font-size:12px;max-width:100%}
.opt img{width:30px;height:30px;object-fit:cover;border-radius:4px;display:block;background:#fff}
.opt .ph{width:30px;height:30px;border-radius:4px;background:#eef0f3;color:#98a2b3;font-size:10px;display:flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:#fff;font-size:12px}
.side{display:flex;flex-direction:column;gap:5px;min-width:0}
.side .line{font-size:12.5px;color:var(--text)}
.side .muted{font-size:12px;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:5px}
.thumbs img{width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#f2f4f7;display:block}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.pager{display:flex;align-items:center;gap:12px;padding:10px 24px 0;max-width:1500px;margin:0 auto}
.pager button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--text)}
.pager button:disabled{opacity:.45;cursor:default}
.pager span{font-size:12.5px;color:var(--muted)}
@media(max-width:1100px){.row{grid-template-columns:96px minmax(0,1fr)}.row .side{grid-column:2}.row .meta{grid-column:2}}
</style>
</head>
<body>
<header>
  <h1>全部产品 · 已采集</h1>
  <p class="sub">采集器当前保存的全部商品（只读）。每行显示商品名称、各变体选项的名称与图片（颜色显示来源图，尺码为文字）、价格区间、变体组合数、图库缩略图与 wearhongxiu 发布状态。支持按标题、offer、款式号搜索。</p>
  <div class="nav">
    <a href="/products" class="on">全部产品</a>
    <a href="/dashboard">控制台</a>
  </div>
  <div class="stats" id="stats"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<nav class="filters" id="filters"></nav>
<div class="pager" id="pager"></div>
<main id="list"><div class="empty">加载中…</div></main>
<script>
let DATA = [];
let pageSize = Number(localStorage.getItem('hx_products_page_size')) || 100;
if (![100, 200, 300].includes(pageSize)) pageSize = 100;
let offset = 0;
let totalFiltered = 0;
let totalAll = 0;
let colorCounts = {};
let wpCounts = {};
let bundleCounts = {};
let shopCounts = [];
let manualBundleCount = 0;
let colors = 0;
let wpFilter = '';
let bundleFilter = '';
let shopFilter = '';
let keyword = '';
let loading = false;

function esc(s){return String(s).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function imgFallback(el){
  const fb = el.getAttribute('data-fallback');
  if (fb && el.src !== fb) { el.removeAttribute('data-fallback'); el.src = fb; return; }
  const box = document.createElement('span'); box.className = 'ph'; box.textContent = '无图';
  el.replaceWith(box);
}
function swatchFallback(el){
  const box = document.createElement('span'); box.className = 'ph'; box.textContent = '无图';
  el.replaceWith(box);
}
function optionChip(o){
  if (o.local || o.source) {
    const src = o.local || o.source;
    const fallback = o.local && o.source ? o.source : '';
    return '<span class="opt"><img loading="lazy" referrerpolicy="no-referrer" src="' + esc(src) + '"'
      + (fallback ? ' data-fallback="' + esc(fallback) + '"' : '') + ' onerror="swatchFallback(this)" alt=""><span>' + esc(o.text) + '</span></span>';
  }
  return '<span class="chip">' + esc(o.text) + '</span>';
}
function dimRow(d){
  return '<div class="dim"><span class="dim-name">' + esc(d.name) + '</span><span class="opts">' + d.options.map(optionChip).join('') + '</span></div>';
}
function priceText(it){
  if (it.priceMin == null && it.priceMax == null) return '价格未记录';
  const unit = it.currency === 'CNY' ? '¥' : (it.currency ? it.currency + ' ' : '');
  if (it.priceMin != null && it.priceMax != null && Number(it.priceMin) !== Number(it.priceMax)) return unit + it.priceMin + ' – ' + it.priceMax;
  return unit + (it.priceMax != null ? it.priceMax : it.priceMin);
}
function wpBadge(it){
  if (!it.wpStatus) return '<span class="badge wpnone">未发布</span>';
  const cls = it.wpStatus === 'publish' ? 'wp' : 'wpdraft';
  return '<span class="badge ' + cls + '">WP ' + esc(it.wpStatus) + '</span>';
}
function listingBadge(it){
  if (it.listingStatus === 'active') return '<span class="badge listing">1688 在售</span>';
  if (it.listingStatus === 'delisted') return '<span class="badge delisted">1688 已下架</span>';
  return '<span class="badge unknown">1688 未知</span>';
}
function row(it){
  const isBundle = it.status === 'bundle';
  const manual = it.bundleManual || null;
  // The manual verdict wins over the automatic one; bundles go through the
  // split flow, so the single-product publish preview only makes sense for
  // regular products.
  const effectiveBundle = manual === 'bundle' ? true : manual === 'clear' ? false : isBundle;
  const thumbs = (it.gallery || []).slice(0, 6);
  const overflow = (it.gallery || []).length - thumbs.length;
  const bundleBtn = (value, label, cls) =>
    '<button type="button" class="bbtn' + (manual === value || (!manual && value === 'auto') ? ' on ' + cls : '') + '"'
    + ' data-bundle-id="' + it.id + '" data-bundle-value="' + value + '">' + label + '</button>';
  return '<article class="row' + (isBundle ? ' is-bundle' : '') + '" data-id="' + it.id + '">'
    + (it.cover
      ? '<img class="cover" loading="lazy" referrerpolicy="no-referrer" src="' + esc(it.cover) + '" onerror="imgFallback(this)" alt="">'
      : '<span class="cover"></span>')
    + '<div class="meta">'
    + '<span class="badge ' + (isBundle ? 'bundle' : 'normal') + '">' + (isBundle ? '捆绑' : '正常') + (manual ? ' · 手动' : '') + '</span>'
    + '<span class="style">#' + it.id + (it.styleNo ? ' · ' + esc(it.styleNo) : '') + '</span>'
    + '<span class="muted">采集 ' + esc(it.date || '') + '</span>'
    + '<span class="muted">offer ' + esc(String(it.offerId || '')) + '</span>'
    + (it.shopName ? '<span class="muted">店铺 ' + esc(it.shopName) + '</span>' : '')
    + wpBadge(it) + listingBadge(it)
    + '</div>'
    + '<div class="body"><div class="title">' + esc(it.title || '') + '</div>'
    + '<div class="dims">' + (it.dims.length ? it.dims.map(dimRow).join('') : '<div class="muted" style="font-size:12px;color:var(--muted)">（无变体选项）</div>') + '</div></div>'
    + '<div class="side">'
    + '<div class="line"><b>' + priceText(it) + '</b>' + (it.moq != null ? ' <span class="muted">· 起订 ' + it.moq + '</span>' : '') + '</div>'
    + '<div class="line">颜色 <b>' + (it.colorCount || 0) + '</b> · 变体组合 <b>' + it.skuRows + '</b> 条 · 图库 ' + (it.gallery || []).length + ' 张</div>'
    + (it.wpUrl ? '<div class="muted"><a href="' + esc(it.wpUrl) + '" target="_blank" rel="noopener">查看线上页面</a></div>' : '')
    + '<div class="bundle-actions"><span class="muted">判定：</span>'
    + bundleBtn('bundle', '捆绑', 'red') + bundleBtn('clear', '正常', 'green') + bundleBtn('auto', '自动', 'gray')
    + '<span class="bstate" data-bstate="' + it.id + '"></span></div>'
    + (effectiveBundle
      ? '<div class="line"><button type="button" class="split-toggle" data-split-id="' + it.id + '">拆分 ▾'
        + (it.hasSplitPlan ? '（已保存）' : '') + '</button></div>'
      : '<div class="line"><button type="button" class="split-toggle" data-pp-id="' + it.id + '">发布预览 ▾</button></div>')
    + (thumbs.length ? '<div class="thumbs">' + thumbs.map((im) => '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(im.thumb) + '" data-fallback="" onerror="imgFallback(this)" alt="">').join('') + (overflow > 0 ? '<span class="muted">+' + overflow + '</span>' : '') + '</div>' : '')
    + '</div></article>';
}
function renderStats(){
  const el = document.getElementById('stats');
  if (!el) return;
  const bundles = DATA.filter((x) => x.status === 'bundle').length;
  const published = DATA.filter((x) => x.wpStatus === 'publish').length;
  el.innerHTML = '<span>筛选后 <b>' + totalFiltered + '</b> / 全部 <b>' + totalAll + '</b> 个产品</span>'
    + '<span>本页 <b>' + DATA.length + '</b></span>'
    + '<span class="b">本页捆绑 <b>' + bundles + '</b></span>'
    + '<span class="n">本页已发布 <b>' + published + '</b></span>'
    + '<span>人工判定 <b>' + manualBundleCount + '</b></span>';
}
function colorLabel(value){
  return value === 6 ? '6+ 色' : value + ' 色';
}
function renderFilters(){
  const el = document.getElementById('filters');
  if (!el) return;
  const colorTotal = Object.values(colorCounts).reduce((sum, n) => sum + Number(n || 0), 0);
  const wpPublish = Number(wpCounts.publish || 0);
  const wpUnpublished = Number(wpCounts.unpublished || 0);
  const parts = ['<span class="label">颜色变体数量：</span>',
    '<button type="button" data-colors="0"' + (colors === 0 ? ' class="on"' : '') + '>全部 (' + colorTotal + ')</button>'];
  for (const value of [1, 2, 3, 4, 5, 6]) {
    const count = Number(colorCounts[String(value)] || 0);
    parts.push('<button type="button" data-colors="' + value + '"' + (colors === value ? ' class="on"' : '')
      + '>' + colorLabel(value) + ' (' + count + ')</button>');
  }
  parts.push('<span class="sep"></span><span class="label">发布状态：</span>');
  parts.push('<button type="button" data-wp=""' + (wpFilter === '' ? ' class="on"' : '')
    + '>全部 (' + (wpPublish + wpUnpublished) + ')</button>');
  parts.push('<button type="button" data-wp="publish"' + (wpFilter === 'publish' ? ' class="on"' : '')
    + '>已发布 (' + wpPublish + ')</button>');
  parts.push('<button type="button" data-wp="unpublished"' + (wpFilter === 'unpublished' ? ' class="on"' : '')
    + '>未发布 (' + wpUnpublished + ')</button>');
  const bundleTotal = Number(bundleCounts.bundle || 0) + Number(bundleCounts.clear || 0);
  parts.push('<span class="sep"></span><span class="label">捆绑：</span>');
  parts.push('<button type="button" data-bundle=""' + (bundleFilter === '' ? ' class="on"' : '')
    + '>全部 (' + bundleTotal + ')</button>');
  parts.push('<button type="button" data-bundle="bundle"' + (bundleFilter === 'bundle' ? ' class="on"' : '')
    + '>捆绑 (' + Number(bundleCounts.bundle || 0) + ')</button>');
  parts.push('<button type="button" data-bundle="clear"' + (bundleFilter === 'clear' ? ' class="on"' : '')
    + '>正常 (' + Number(bundleCounts.clear || 0) + ')</button>');
  const shopTotal = shopCounts.reduce((sum, s) => sum + Number(s.products || 0), 0);
  const shopOptions = ['<option value="">全部店铺 (' + shopTotal + ')</option>'];
  for (const shop of shopCounts) {
    shopOptions.push('<option value="' + esc(shop.id) + '"' + (shopFilter === String(shop.id) ? ' selected' : '')
      + '>' + esc(shop.name) + ' (' + shop.products + ')</option>');
  }
  parts.push('<span class="sep"></span><span class="label">店铺：</span>');
  parts.push('<select id="shopSelect" title="按 1688 来源店铺筛选">' + shopOptions.join('') + '</select>');

function render(){

async function loadPage(){
  if (loading) return;
  loading = true;
  try {
    const params = new URLSearchParams({ limit: String(pageSize), offset: String(offset) });
    if (keyword) params.set('search', keyword);
    if (colors) params.set('colors', String(colors));
    if (wpFilter) params.set('wp', wpFilter);
    if (bundleFilter) params.set('bundle', bundleFilter);
    if (shopFilter) params.set('shop', shopFilter);
    const res = await fetch('/api/product-catalog?' + params.toString(), { headers: { accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    DATA = Array.isArray(body.items) ? body.items : [];
    totalFiltered = Number(body.count) || 0;
    totalAll = Number(body.total) || totalFiltered;
    colorCounts = body.colorCounts || {};
    wpCounts = body.wpCounts || {};
    bundleCounts = body.bundleCounts || {};
    shopCounts = Array.isArray(body.shopCounts) ? body.shopCounts : [];
    manualBundleCount = Number(body.manualBundleCount) || 0;
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="empty">加载失败：' + esc(String((e && e.message) || e)) + '</div>';
  } finally {
    loading = false;
  }
}
function wireTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '<span class="label">每页</span>'
    + [100, 200, 300].map((n) => '<button type="button" data-size="' + n + '">' + n + '</button>').join('')
    + '<input id="search" type="search" placeholder="搜索标题 / offer / 款式号…">';
  tabsEl.addEventListener('click', (e) => {
    const size = e.target.closest('button[data-size]');
    if (size) {
      const next = Number(size.dataset.size);
      if (next !== pageSize) {
        pageSize = next;
        localStorage.setItem('hx_products_page_size', String(pageSize));
        offset = 0;
        void loadPage();
      }
    }
  });
  let searchTimer = null;
  tabsEl.addEventListener('input', (e) => {
    if (e.target.id !== 'search') return;
    keyword = String(e.target.value || '').trim().toLowerCase();
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { offset = 0; void loadPage(); }, 350);
  });
  const pagerEl = document.getElementById('pager');
  pagerEl.addEventListener('click', (e) => {
    if (e.target.closest('#pagePrev') && offset > 0) { offset = Math.max(offset - pageSize, 0); void loadPage(); return; }
    if (e.target.closest('#pageNext') && offset + pageSize < totalFiltered) { offset += pageSize; void loadPage(); }
  });
}
function wireFilters(){
  const el = document.getElementById('filters');
  if (!el) return;
  el.addEventListener('click', (e) => {
    const colorBtn = e.target.closest('button[data-colors]');
    if (colorBtn) {
      const next = Number(colorBtn.dataset.colors);
      if (next === colors) return;
      colors = next;
      offset = 0;
      void loadPage();
      return;
    }
    const wpBtn = e.target.closest('button[data-wp]');
    if (wpBtn) {
      const next = String(wpBtn.dataset.wp || '');
      if (next === wpFilter) return;
      wpFilter = next;
      offset = 0;
      void loadPage();
      return;
    }
    const bundleBtn = e.target.closest('button[data-bundle]');
    if (bundleBtn) {
      const next = String(bundleBtn.dataset.bundle || '');
      if (next === bundleFilter) return;
      bundleFilter = next;
      offset = 0;
      void loadPage();
    }
  });
  el.addEventListener('change', (e) => {
    if (e.target.id !== 'shopSelect') return;
    const next = String(e.target.value || '');
    if (next === shopFilter) return;
    shopFilter = next;
    offset = 0;
    void loadPage();
  });
}
async function setBundleStatus(id, value, stateEl){

const SPLITS = new Map();
const SPLIT_CONTENTS = new Map();
const SPLIT_IMAGES = new Map();
const SPLIT_PUBLISH_SETS = new Map();

function splitItem(id){ return DATA.find((x) => String(x.id) === String(id)); }

function splitOptionImage(id, text){
  const item = splitItem(id);
  for (const dim of (item && item.dims) || []) {
    for (const option of dim.options || []) {
      if (option.text === text) return option.local || option.source || null;
    }
  }
  return null;
}

async function toggleSplit(id){
  const row = document.querySelector('.row[data-id="' + id + '"]');
  if (!row) return;
  const existing = document.getElementById('split-panel-' + id);
  if (existing) { existing.remove(); return; }
  const panel = document.createElement('section');
  panel.className = 'split-panel';
  panel.id = 'split-panel-' + id;
  panel.innerHTML = '<div class="sp-status">加载拆分方案…</div>';
  row.insertAdjacentElement('afterend', panel);
  try {
    const res = await fetch('/api/product-details/' + id + '/split-plan', { headers: { accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    if (Array.isArray(body.images)) {
      SPLIT_IMAGES.set(String(id), new Map(body.images.map((image) => [String(image.id), image.thumb || null])));
    }
    if (body.plan) {
      SPLITS.set(String(id), body.plan);
      try {
        const contentRes = await fetch('/api/product-details/' + id + '/split-content', { headers: { accept: 'application/json' } });
        if (contentRes.ok) {
          const contentBody = await contentRes.json();
          if (contentBody.result) SPLIT_CONTENTS.set(String(id), contentBody.result);
          SPLIT_PUBLISH_SETS.set(String(id), contentBody.publishSets ?? null);

async function runSplitAnalysis(id){
  const status = document.getElementById('split-status-' + id);
  if (status) status.textContent = '模型分析中（查看图片并分组）…约 20–60 秒';
  try {
    const res = await fetch('/api/product-details/' + id + '/split-analysis', { method: 'POST', headers: { 'content-type': 'application/json' } });
    if (!res.ok) {
      const text = await res.text();
      if (status) status.textContent = '分析失败 HTTP ' + res.status + '：' + text.slice(0, 160);
      return;
    }
    const body = await res.json();
    renderSplitPanel(id, body.plan);
  } catch (e) {
    if (status) status.textContent = '分析失败：' + String((e && e.message) || e);
  }
}

function moveSplitOption(id, text, target){
  const plan = SPLITS.get(String(id));
  if (!plan) return;
  for (const product of plan.products || []) {
    product.options = (product.options || []).filter((value) => value !== text);
  }
  plan.ignoredOptions = (plan.ignoredOptions || []).filter((value) => value !== text);
  if (target >= 0 && plan.products[target]) plan.products[target].options = [...(plan.products[target].options || []), text];
  else plan.ignoredOptions = [...plan.ignoredOptions, text];
  plan.source = 'manual';
  renderSplitPanel(id, plan);
}

let splitPubDragEl = null;

function cleanupSplitPubDrag(){
  if (!splitPubDragEl) return;
  splitPubDragEl.classList.remove('dragging');
  const strip = splitPubDragEl.parentElement;
  if (strip) for (const other of strip.querySelectorAll('.sp-pub-img')) other.classList.remove('drop-before', 'drop-after');
  splitPubDragEl = null;
}

document.addEventListener('dragstart', (e) => {
  const el = e.target.closest('.sp-pub-img');
  if (!el || !e.dataTransfer) return;
  splitPubDragEl = el;
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', el.dataset.pubImg || ''); } catch { /* ignore */ }
});
document.addEventListener('dragover', (e) => {
  const el = e.target.closest('.sp-pub-img');
  if (!el || !splitPubDragEl || el === splitPubDragEl || el.parentElement !== splitPubDragEl.parentElement) return;
  e.preventDefault();
  const rect = el.getBoundingClientRect();
  const after = e.clientX > rect.left + rect.width / 2;
  for (const other of el.parentElement.querySelectorAll('.sp-pub-img')) other.classList.remove('drop-before', 'drop-after');
  el.classList.add(after ? 'drop-after' : 'drop-before');
});
document.addEventListener('drop', (e) => {
  const el = e.target.closest('.sp-pub-img');
  if (!el || !splitPubDragEl || el === splitPubDragEl || el.parentElement !== splitPubDragEl.parentElement) return;
  e.preventDefault();
  const rect = el.getBoundingClientRect();
  const after = e.clientX > rect.left + rect.width / 2;
  if (after) el.after(splitPubDragEl); else el.before(splitPubDragEl);
  cleanupSplitPubDrag();
});
document.addEventListener('dragend', () => cleanupSplitPubDrag());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { endSwatchPick(); endAddPick(); } });

async function pollSplitOrderJob(jobId, status){
  for (let attempt = 0; attempt < 60; attempt += 1) {
    await new Promise((resolve) => setTimeout(resolve, 3000));
    try {
      const res = await fetch('/api/split-order-jobs/' + jobId, { headers: { accept: 'application/json' } });
      if (!res.ok) continue;
      const job = await res.json();
      if (job.status === 'completed') { if (status) status.textContent = '已同步到 WordPress'; return 'completed'; }
      if (job.status === 'failed') { if (status) status.textContent = '同步失败：' + String(job.error || '').slice(0, 80); return 'failed'; }
      if (status) status.textContent = '同步中…';
    } catch { /* keep polling */ }
  }
  if (status) status.textContent = '同步仍在进行，稍后刷新查看';
  return 'pending';
}

async function savePublishSet(id, productId, button){
  const panel = document.getElementById('split-panel-' + id);
  if (!panel || !button) return;
  endAddPick();
  const row = button.closest('.sp-row');
  const strip = row ? row.querySelector('.sp-imgs') : null;
  const status = row ? row.querySelector('.sp-pub-status') : null;
  if (!strip) return;
  const imageIds = [...strip.querySelectorAll('.sp-pub-img')].map((el) => String(el.dataset.pubImg || '')).filter(Boolean);
  if (!imageIds.length) return;
  button.disabled = true;
  if (status) status.textContent = '保存中…';
  try {
    const res = await fetch('/api/product-details/' + id + '/split-publish-images', {
      method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ productId, imageIds }),
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error((body && body.error) || ('HTTP ' + res.status));
    if (body && body.sync && body.sync.jobId) {
      if (status) status.textContent = '已保存，正在同步到 WordPress…';
      const done = await pollSplitOrderJob(body.sync.jobId, status);
      await reloadSplitPanel(id);
      setPublishStatus(id, productId, done === 'completed' ? '已同步到 WordPress'
        : done === 'failed' ? '同步失败' : '同步仍在进行，稍后刷新查看');
    } else {
      await reloadSplitPanel(id);
      setPublishStatus(id, productId, '已保存（未发布，发布时生效）');
    }
  } catch (e) {
    if (status) status.textContent = '保存失败：' + String((e && e.message) || e).slice(0, 80);
  } finally {
    button.disabled = false;
  }
}

function fmtMoney(value, currency){
  if (value === null || value === undefined) return '—';
  const unit = currency === 'CNY' ? '¥' : (currency === 'USD' ? '$' : (currency ? currency + ' ' : ''));
  return unit + Number(value).toFixed(value % 1 === 0 ? 0 : 2);
}

async function togglePublishPreview(id){

}

async function runSplitContent(id, button){
  if (button) { button.disabled = true; button.textContent = '生成中…约 1–3 分钟'; }
  try {
    const res = await fetch('/api/product-details/' + id + '/split-content', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 100));
    const job = await res.json();
    let state = job;
    for (let attempt = 0; attempt < 60 && state.status === 'running'; attempt += 1) {
      await new Promise((resolve) => setTimeout(resolve, 5000));
      const poll = await fetch('/api/split-content-jobs/' + job.id, { headers: { accept: 'application/json' } });
      state = await poll.json();
    }
    if (state.status !== 'completed') throw new Error(state.error || state.status);
    const contentRes = await fetch('/api/product-details/' + id + '/split-content', { headers: { accept: 'application/json' } });
    const body = await contentRes.json();
    if (body.result) SPLIT_CONTENTS.set(String(id), body.result);
    if (button) button.textContent = '生成内容（LLM）';
    renderSplitPanel(id);
  } catch (e) {
    if (button) button.textContent = '失败：' + String((e && e.message) || e).slice(0, 50);
  } finally {
    if (button) button.disabled = false;
  }
}

document.addEventListener('click', (e) => {
  const bundleBtn = e.target.closest('button[data-bundle-value]');
  if (bundleBtn) {
    const stateEl = document.querySelector('[data-bstate="' + bundleBtn.dataset.bundleId + '"]');
    void setBundleStatus(bundleBtn.dataset.bundleId, bundleBtn.dataset.bundleValue, stateEl);
    return;
  }
  const ppNorm = e.target.closest('button[data-pp-normalize]');
  if (ppNorm) { void runVariantNormalization(String(ppNorm.dataset.ppNormalize), ppNorm); return; }
  const ppDedupe = e.target.closest('button[data-pp-dedupe]');
  if (ppDedupe) { void runImageDedupe(String(ppDedupe.dataset.ppDedupe), ppDedupe); return; }
  const splitContentBtn = e.target.closest('button[data-split-content]');
  if (splitContentBtn) { void runSplitContent(String(splitContentBtn.dataset.splitContent), splitContentBtn); return; }
  const addGroup = e.target.closest('button[data-split-addgroup]');
  if (addGroup) { addSplitGroup(String(addGroup.dataset.splitAddgroup)); return; }
  const unassign = e.target.closest('button[data-split-unassign]');
  if (unassign) {
    unassignSplitImage(String(unassign.dataset.splitUnassign), unassign.dataset.kind,
      unassign.dataset.ref, Number(unassign.dataset.idx));
    return;
  }
  const ppToggle = e.target.closest('button[data-pp-id]');
  if (ppToggle) { void togglePublishPreview(String(ppToggle.dataset.ppId)); return; }
  const ppReload = e.target.closest('button[data-pp-reload]');
  if (ppReload) {
    const id = String(ppReload.dataset.ppReload);
    const existing = document.getElementById('pp-panel-' + id);
    if (existing) existing.remove();
    void togglePublishPreview(id);
    return;
  }
  const ppClose = e.target.closest('button[data-pp-close]');
  if (ppClose) {
    const panel = document.getElementById('pp-panel-' + ppClose.dataset.ppClose);
    if (panel) panel.remove();
    return;
  }
  const toggle = e.target.closest('button[data-split-id]');
  if (toggle) { void toggleSplit(String(toggle.dataset.splitId)); return; }
  const run = e.target.closest('button[data-split-run]');
  if (run) { void runSplitAnalysis(String(run.dataset.splitRun)); return; }
  const close = e.target.closest('button[data-split-close]');
  if (close) {
    const panel = document.getElementById('split-panel-' + close.dataset.splitClose);
    if (panel) panel.remove();
    return;
  }
  const save = e.target.closest('button[data-split-save]');
  if (save) { void saveSplitPlan(String(save.dataset.splitSave)); return; }
  const pubSave = e.target.closest('button[data-pub-save]');
  if (pubSave) { void savePublishSet(String(pubSave.dataset.pubSave), String(pubSave.dataset.pubProduct), pubSave); return; }
  const pubAdd = e.target.closest('button[data-pub-add]');
  if (pubAdd) {
    const wasActive = Boolean(addPick && addPick.button === pubAdd);
    endAddPick();
    endSwatchPick();
    if (!wasActive) {
      const strip = publishStripFor(pubAdd);
      const assignedStrip = assignedStripFor(pubAdd);
      const row = pubAdd.closest('.sp-row');
      const statusEl = row ? row.querySelector('.sp-pub-status') : null;
      if (strip && assignedStrip) {
        addPick = {
          id: String(pubAdd.dataset.pubAdd),
          productId: String(pubAdd.dataset.pubProduct),
          strip, assignedStrip, statusEl, button: pubAdd,
        };
        assignedStrip.classList.add('adding-publish');
        pubAdd.textContent = '结束添加';
        if (statusEl) statusEl.textContent = '点选「已分配图」中的图片加入发布图（Esc 结束）';
      }
    }
    return;
  }
  const pubRemove = e.target.closest('button.sp-pub-x');
  if (pubRemove) {
    const thumb = pubRemove.closest('.sp-pub-img');
    if (thumb) thumb.remove();
    return;
  }
  const swatchBtn = e.target.closest('button[data-swatch-replace]');
  if (swatchBtn) {
    const strip = publishStripFor(swatchBtn);
    const row = swatchBtn.closest('.sp-row');
    const statusEl = row ? row.querySelector('.sp-swatch-status') : null;
    endSwatchPick();
    endAddPick();
    if (strip) {
      swatchPick = {
        id: String(swatchBtn.dataset.swatchReplace),
        productId: String(swatchBtn.dataset.swatchProduct),
        colourSource: String(swatchBtn.dataset.swatchColour),
        strip, statusEl,
      };
      strip.classList.add('picking-swatch');
      if (statusEl) statusEl.textContent = '请从上方「发布图」中点选一张作为 Swatch（Esc 取消）';
    }
    return;
  }
  const swatchReset = e.target.closest('button[data-swatch-reset]');
  if (swatchReset) {
    const row = swatchReset.closest('.sp-row');
    void saveSwatch(String(swatchReset.dataset.swatchReset), String(swatchReset.dataset.swatchProduct),
      String(swatchReset.dataset.swatchColour), null, row ? row.querySelector('.sp-swatch-status') : null);
    return;
  }
  if (addPick) {
    const thumb = e.target.closest('.sp-img[data-assign-ref]');
    if (thumb && thumb.parentElement === addPick.assignedStrip) {
      const imgEl = thumb.querySelector('img');
      addAssignedToPublish(addPick, thumb.dataset.assignRef, imgEl ? imgEl.getAttribute('src') : null);
      return;
    }
  }
  if (swatchPick) {
    const img = e.target.closest('.sp-pub-img');
    if (img && img.parentElement === swatchPick.strip) {
      const pick = swatchPick;
      void saveSwatch(pick.id, pick.productId, pick.colourSource, String(img.dataset.pubImg || ''), pick.statusEl);
      return;
    }
  }
});
document.addEventListener('input', (e) => {
  const nameInput = e.target.closest('input[data-split-name]');
  if (!nameInput) return;
  const plan = SPLITS.get(String(nameInput.dataset.splitName));
  const product = plan && (plan.products || [])[Number(nameInput.dataset.idx)];
  if (product) { product.name = nameInput.value; plan.source = 'manual'; }
});
document.addEventListener('change', (e) => {
  const move = e.target.closest('select[data-split-move]');
  if (move) moveSplitOption(String(move.dataset.splitMove), move.dataset.opt, Number(move.value));
});
(async () => {
  wireTabs();
  wireFilters();
  await loadPage();
})();
</script>
