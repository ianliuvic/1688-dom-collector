<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>1688 商品审核台</title>
  <style>
    :root{--bg:#f5f7f3;--surface:#fff;--ink:#17211b;--muted:#6c776f;--line:#dfe5df;--green:#176b49;--green2:#dcefe4;--amber:#a55f12;--amber2:#fff0d8;--red:#a63b32;--red2:#fbe5e2;--blue:#285f94;--blue2:#e2edf8;--shadow:0 8px 28px rgba(24,43,31,.07);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink)}
    button,input,select{font:inherit}
    .wrap{max-width:1180px;margin:auto;padding:24px}
    .header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
    .brand{display:flex;gap:13px;align-items:center}
    .mark{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}
    .brand h1{font-size:23px;margin:0 0 4px}
    .sub{font-size:13px;color:var(--muted)}
    .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
    .btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink)}
    .btn:hover{border-color:#aebbb2}
    .btn:disabled{opacity:.55;cursor:wait}
    .notice{background:var(--blue2);border:1px solid #c3d8ee;color:#1d4a72;border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.6;margin-bottom:16px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
    .tab b{color:var(--ink);margin-left:6px}
    .tab.on{border-color:var(--ink);color:var(--ink);box-shadow:var(--shadow)}
    .tab.on.review{border-color:var(--red);color:var(--red)}
    .tab.on.rerun{border-color:var(--amber);color:var(--amber)}
    .tab.on.ready{border-color:var(--green);color:var(--green)}
    .controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    .controls input,.controls select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:220px;color:var(--ink)}
    .controls select{min-width:190px}
    .summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:13px 15px;margin-bottom:16px;font-size:12.5px;display:flex;gap:22px;flex-wrap:wrap}
    .summary div b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
    .codes{display:flex;gap:7px;flex-wrap:wrap}
    code{background:#eef2ee;border-radius:6px;padding:2px 6px;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;display:grid;grid-template-columns:212px 1fr;gap:16px}
    .thumbwrap{display:flex;flex-direction:column;gap:8px;min-width:0}
    .shot{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#eef2ee;border:1px solid var(--line);cursor:zoom-in}
    .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer;opacity:.82}
    .thumbs img.on,.thumbs img:hover{opacity:1;border-color:var(--ink)}
    .body{min-width:0}
    .toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
    .badge{font-size:11.5px;padding:4px 9px;border-radius:999px;font-weight:600}
    .badge.review{background:var(--red2);color:var(--red)}
    .badge.rerun{background:var(--amber2);color:var(--amber)}
    .badge.ready{background:var(--green2);color:var(--green)}
    .badge.published{background:#eceeec;color:var(--muted)}
    .itemno{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:700}
    .title{font-size:15px;line-height:1.5;margin:0 0 7px;word-break:break-word}
    .meta{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
    .block{border-radius:10px;padding:11px 12px;margin-bottom:9px;font-size:12.5px;line-height:1.65}
    .block.red{background:var(--red2);border:1px solid #f0cdc7}
    .block.amber{background:var(--amber2);border:1px solid #f0dcbb}
    .block h4{margin:0 0 7px;font-size:12px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
    .warn{margin-bottom:8px}
    .warn:last-child{margin-bottom:0}
    .warn .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .sev{font-size:11px;padding:2px 7px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
    .sev.review{color:var(--red);border-color:#e8c2bb}
    .warn p{margin:5px 0 0;color:#3c4740}
    details{margin-top:6px}
    summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
    summary::-webkit-details-marker{display:none}
    summary::before{content:"▸ ";font-size:11px}
    details[open] summary::before{content:"▾ "}
    .links{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-top:11px}
    .links a{color:var(--blue);text-decoration:none}
    .links a:hover{text-decoration:underline}
    .empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:36px;text-align:center;color:var(--muted);font-size:13.5px}
    .error{display:none;background:var(--red2);border:1px solid #f0cdc7;color:var(--red);border-radius:11px;padding:12px;margin-bottom:14px;font-size:13px}
    .footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
    @media(max-width:760px){.card{grid-template-columns:1fr}.wrap{padding:15px}.controls input,.controls select{min-width:100%}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="header">
    <div class="brand">
      <div class="mark">审</div>
      <div>
        <h1>1688 商品审核台</h1>
        <div class="sub">需要人工判断的商品、卡点原因与原始图片 · 只读页面</div>
      </div>
    </div>
    <div class="actions">
      <span class="chip" id="stamp">连接中…</span>
      <button class="btn" id="copy">复制清单</button>
      <button class="btn" id="refresh">刷新</button>
    </div>
  </header>

  <div class="notice">
    本页仅展示，不会改动任何商品。<b>审核动作（通过发布 / 保持暂缓 / 重跑审计）尚未启用</b>，确认这个页面顺手之后再加。
    判定规则与线上发布链路一致：审计标记为 <code>review</code> 的问题会拦下商品；<code>info</code>/<code>warning</code> 只是提示；缺少尺码表按现有规则可放行。
  </div>

  <div id="error" class="error"></div>

  <nav class="tabs" id="tabs"></nav>

  <div class="controls">
    <input id="query" type="search" placeholder="搜索货号 / 标题 / 店铺">
    <select id="shop"><option value="">全部店铺</option></select>
    <label class="chip"><input type="checkbox" id="onlyBlocking"> 只看有卡点的</label>
  </div>

  <section class="summary" id="summary"></section>

  <section id="list"></section>
  <div class="footer">数据生成于 <span id="generated">—</span> · 最近 <span id="days">30</span> 天采集的详情</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '—').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt = (v) => v ? new Intl.DateTimeFormat('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v)) : '—';
const money = (item) => {
  if (item.priceMin == null && item.priceMax == null) return '价格未知';
  const unit = item.currency === 'CNY' ? '¥' : '';
  const min = item.priceMin == null ? '—' : item.priceMin;
  const max = item.priceMax == null ? min : item.priceMax;
  return min === max ? `${unit}${min}` : `${unit}${min}–${max}`;
};
const TABS = [
  ['needs_review', '待人工审核', 'review'],
  ['needs_audit_rerun', '需重跑审计', 'rerun'],
  ['ready_to_publish', '可放行', 'ready'],
  ['published', '已发布', ''],
  ['all', '全部', ''],
];
const state = { data: null, tab: 'needs_review', query: '', shop: '', onlyBlocking: false };

function warningRow(w) {
  const confidence = w.confidence == null ? '' : ` <span class="sev">置信度 ${w.confidence}</span>`;
  const scope = w.scope ? ` <span class="sev">${esc(w.scope)}</span>` : '';
  return `<div class="warn">
    <div class="head"><code>${esc(w.code)}</code><span class="sev ${esc(w.severity)}">${esc(w.severity)}</span>${scope}${confidence}</div>
    ${w.evidence ? `<p>${esc(w.evidence)}</p>` : ''}
  </div>`;
}

function card(item) {
  const images = item.images.length ? item.images : [];
  const main = images.find((i) => i.type === 'main') || images[0];
  const thumbs = images.filter((i) => i !== main).slice(0, 8);
  const shot = main
    ? `<img class="shot" src="${esc(main.sourceUrl)}" alt="" data-full="${esc(main.sourceUrl)}" loading="lazy">`
    : `<div class="shot" style="display:grid;place-items:center;color:var(--muted);font-size:12px">无图片</div>`;
  const thumbHtml = thumbs.map((t) => `<img src="${esc(t.sourceUrl)}" alt="" data-full="${esc(t.sourceUrl)}" loading="lazy">`).join('');
  const blocking = item.blockingWarnings.length
    ? `<div class="block red"><h4>发布卡点 · ${item.blockingWarnings.length} 项</h4>${item.blockingWarnings.map(warningRow).join('')}</div>`
    : item.bucket === 'published'
      ? ''
      : `<div class="block" style="background:var(--green2);border:1px solid #c9e4d5"><h4>无发布卡点</h4>审计未发现需要人工判断的问题。</div>`;
  const rerun = item.bucket === 'needs_audit_rerun'
    ? `<div class="block amber"><h4>审计未完成</h4>图片审计：${esc(item.imageAudit.runStatus ?? '无记录')}${item.imageAudit.error ? ` · ${esc(item.imageAudit.error)}` : ''}<br>SKU 审计：${esc(item.skuAudit.runStatus ?? '无记录')}${item.skuAudit.error ? ` · ${esc(item.skuAudit.error)}` : ''}</div>`
    : '';
  const notices = item.notices.length
    ? `<details><summary>另有 ${item.notices.length} 条提示（不影响发布）</summary><div style="margin-top:8px">${item.notices.map(warningRow).join('')}</div></details>`
    : '';
  const links = [
    item.sourceUrl ? `<a href="${esc(item.sourceUrl)}" target="_blank" rel="noreferrer">1688 源页面</a>` : '',
    item.publication.url ? `<a href="${esc(item.publication.url)}" target="_blank" rel="noreferrer">wearhongxiu 页面</a>` : '',
    `<span style="color:var(--muted)">详情 #${esc(item.id)}</span>`,
  ].filter(Boolean).join('');

  return `<article class="card">
    <div class="thumbwrap">${shot}${thumbHtml ? `<div class="thumbs">${thumbHtml}</div>` : ''}</div>
    <div class="body">
      <div class="toprow">
        <span class="badge ${esc(item.bucket === 'needs_review' ? 'review' : item.bucket === 'needs_audit_rerun' ? 'rerun' : item.bucket === 'ready_to_publish' ? 'ready' : 'published')}">${esc(item.bucketLabel)}</span>
        <span class="itemno">${esc(item.itemNo || item.publication.styleNo || item.offerId || '未知货号')}</span>
        <span class="meta">${esc(item.shopName || '未知店铺')}</span>
      </div>
      <h3 class="title">${esc(item.title || '（无标题）')}</h3>
      <div class="meta">
        <span>${esc(money(item))}</span>
        <span>${esc(item.sourceCategory || '类目未知')}</span>
        <span>采集 ${dt(item.lastCrawledAt)}</span>
        <span>Gallery ${item.galleryImageCount} 张${item.galleryVerifiedComplete ? ' · 完整' : ' · 未确认'}</span>
        <span>RAG ${item.rag.active ? 'active' : esc(item.rag.status || '未同步')}</span>
      </div>
      ${blocking}${rerun}${notices}
      <div class="links">${links}</div>
    </div>
  </article>`;
}

function filtered() {
  const items = state.data?.items ?? [];
  const q = state.query.trim().toLowerCase();
  return items.filter((item) => {
    if (state.tab !== 'all' && item.bucket !== state.tab) return false;
    if (state.shop && String(item.shopId) !== state.shop) return false;
    if (state.onlyBlocking && !item.blockingWarnings.length) return false;
    if (!q) return true;
    return [item.itemNo, item.publication.styleNo, item.title, item.shopName, item.offerId]
      .filter(Boolean).some((v) => String(v).toLowerCase().includes(q));
  });
}

function renderTabs() {
  const counts = state.data?.counts ?? {};
  $('tabs').innerHTML = TABS.map(([key, label, tone]) => {
    const count = key === 'all' ? (counts.total ?? 0) : (counts[key] ?? 0);
    const on = state.tab === key ? ` on ${tone}` : '';
    return `<button class="tab${on}" data-tab="${key}">${label}<b>${count}</b></button>`;
  }).join('');
}

function renderSummary() {
  const codes = state.data?.topBlockingCodes ?? [];
  const shops = state.data?.pendingByShop ?? [];
  const chips = (rows) => rows.length
    ? `<div class="codes">${rows.slice(0, 8).map((r) => `<span class="chip"><code>${esc(r.label)}</code>${r.products}</span>`).join('')}</div>`
    : '<span style="color:var(--muted)">无</span>';
  $('summary').innerHTML = `
    <div style="flex:1;min-width:280px"><b>卡点原因分布</b>${chips(codes)}</div>
    <div style="flex:1;min-width:220px"><b>待处理店铺</b>${chips(shops)}</div>`;
}

function render() {
  renderTabs();
  renderSummary();
  const rows = filtered();
  $('list').innerHTML = rows.length
    ? rows.map(card).join('')
    : '<div class="empty">这个筛选下没有商品。切换到「全部」或清空搜索看看。</div>';
  const stamp = state.data ? new Date(state.data.generatedAt).toLocaleString('zh-CN') : null;
  $('generated').textContent = stamp ?? '—';
  $('days').textContent = state.data?.window?.days ?? 30;
  $('stamp').textContent = stamp ? `生成于 ${stamp}` : '连接中…';
}

function fillShops() {
  const items = state.data?.items ?? [];
  const shops = new Map();
  for (const item of items) if (item.shopId != null) shops.set(String(item.shopId), item.shopName || `#${item.shopId}`);
  const current = $('shop').value;
  $('shop').innerHTML = '<option value="">全部店铺</option>' + [...shops.entries()]
    .map(([id, name]) => `<option value="${esc(id)}">${esc(name)}</option>`).join('');
  $('shop').value = current;
}

async function load() {
  const button = $('refresh');
  button.disabled = true;
  $('error').style.display = 'none';
  try {
    const response = await fetch('/api/review/queue', {credentials: 'same-origin', cache: 'no-store'});
    if (!response.ok) throw new Error(`请求失败：HTTP ${response.status}`);
    state.data = await response.json();
    fillShops();
    render();
  } catch (error) {
    $('error').textContent = error.message;
    $('error').style.display = 'block';
    $('stamp').textContent = '读取失败';
  } finally {
    button.disabled = false;
  }
}

function plainList() {
  const rows = filtered();
  const lines = rows.map((item) => {
    const head = `${item.bucketLabel} | ${item.itemNo || item.offerId || item.id} | ${item.shopName || '未知店铺'} | ${item.title || ''}`;
    const reasons = item.blockingWarnings.map((w) => `    - ${w.code}: ${w.evidence || ''}`).join('\n');
    return reasons ? `${head}\n${reasons}` : head;
  });
  return lines.join('\n') || '（无商品）';
}

$('refresh').addEventListener('click', load);
$('tabs').addEventListener('click', (event) => {
  const tab = event.target.closest('[data-tab]');
  if (!tab) return;
  state.tab = tab.dataset.tab;
  render();
});
$('query').addEventListener('input', (event) => { state.query = event.target.value; render(); });
$('shop').addEventListener('change', (event) => { state.shop = event.target.value; render(); });
$('onlyBlocking').addEventListener('change', (event) => { state.onlyBlocking = event.target.checked; render(); });
$('copy').addEventListener('click', async () => {
  const text = plainList();
  try {
    await navigator.clipboard.writeText(text);
    $('copy').textContent = '已复制';
  } catch {
    window.prompt('复制下面的清单：', text);
  }
  setTimeout(() => { $('copy').textContent = '复制清单'; }, 1800);
});
document.addEventListener('click', (event) => {
  const target = event.target;
  if (target.tagName === 'IMG' && target.dataset.full) {
    if (target.classList.contains('shot')) { window.open(target.dataset.full, '_blank', 'noreferrer'); return; }
    const shot = target.closest('.card')?.querySelector('.shot');
    if (shot) { shot.src = target.dataset.full; shot.dataset.full = target.dataset.full; }
    target.closest('.thumbs')?.querySelectorAll('img').forEach((img) => img.classList.remove('on'));
    target.classList.add('on');
  }
});
load();
</script>
</body>
</html>
