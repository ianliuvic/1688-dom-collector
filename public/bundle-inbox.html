<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>捆绑商品 · 待人工拆分</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e4e7ec;--text:#111827;--muted:#6b7280;--bundle:#b42318;--set:#b54708;--normal:#067647;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:18px 24px 6px}h1{margin:0 0 6px;font-size:19px}.sub{color:var(--muted);font-size:13px;margin:0 0 8px;max-width:1200px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:8px 0}
.stats b{font-size:16px}.stats .b{color:var(--bundle)}.stats .n{color:var(--normal)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);padding:10px 24px;z-index:5;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13px;color:var(--text)}
.tabs button.on{background:var(--text);color:#fff;border-color:var(--text)}
#sizeToggle{border-style:dashed}
#sizeToggle.on{background:var(--bundle);border-color:var(--bundle);color:#fff}
#search{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;min-width:220px;outline:none}
main{display:flex;flex-direction:column;gap:8px;padding:14px 24px 48px;max-width:1500px;margin:0 auto}
.row{display:grid;grid-template-columns:250px minmax(0,1fr) 240px;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;align-items:start}
.row.has-plan{border-left:4px solid var(--normal)}
.meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.badge{align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff}
.badge.bundle{background:var(--bundle)}
.meta .style{font-weight:700;font-size:13.5px}
.meta .muted{font-size:12px;color:var(--muted)}
.split-toggle{margin-top:3px;align-self:flex-start;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
.split-toggle:hover{border-color:#98a2b3}
.plan-flag{margin-top:3px;font-size:11px;color:var(--normal);display:none}
.row.has-plan .plan-flag{display:inline}
.body{display:flex;flex-direction:column;gap:6px;min-width:0}
.title{font-size:13.5px;font-weight:600;line-height:1.4}
.dims{display:flex;flex-direction:column;gap:4px}
.dim{display:flex;gap:8px;align-items:flex-start}
.dim-name{font-size:11px;font-weight:700;color:var(--muted);min-width:34px;padding-top:6px;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:2px 8px 2px 3px;background:#fff;font-size:12px;max-width:100%}
.opt img{width:30px;height:30px;object-fit:cover;border-radius:4px;display:block;background:#fff}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:#fff;font-size:12px}
.side{display:flex;flex-direction:column;gap:5px;min-width:0}
.reason{margin:0;font-size:12px;color:var(--text);background:#faf5f4;border-left:3px solid var(--bundle);padding:5px 8px;border-radius:4px;word-break:break-all}
.audit{font-size:11.5px;color:var(--muted)}
.editor{background:#fbfcfe;border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:12px 14px;margin-top:-9px}
.editor.hidden{display:none}
.ed-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ed-head b{font-size:13.5px}
.ed-status{font-size:12px;color:var(--muted)}
.ed-head button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.ed-head button:hover{border-color:#98a2b3}
.groups{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.group-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:2px 8px}
.group-chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.group-chip input{border:none;outline:none;font-size:12px;width:92px;background:transparent}
.group-chip button{border:none;background:transparent;color:#98a2b3;cursor:pointer;font-size:13px;padding:0;line-height:1}
.ed-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media(max-width:980px){.ed-cols{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
.ed-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.ed-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px 6px;margin-bottom:6px}
.ed-item img{width:34px;height:34px;object-fit:cover;border-radius:4px;flex:none}
.ed-item .nm{font-size:12px;flex:1;min-width:0;word-break:break-all}
.ed-item .sz{color:var(--muted);font-style:normal;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px}
.assign{display:flex;gap:4px;flex:none}
.assign button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;cursor:pointer;line-height:1;padding:0}
.imgs-grid{display:flex;flex-wrap:wrap;gap:8px}
.img-cell{width:132px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px}
.img-cell img{width:122px;height:122px;object-fit:cover;border-radius:4px;display:block;background:#f2f4f7}
.img-cell .assign{margin-top:5px;justify-content:center}
.img-cell .cap{font-size:10.5px;color:var(--muted);text-align:center;margin-top:2px}
.hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.gsum{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.gsum-line{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:3px 9px;background:#fff}
.gsum-line .dot{width:9px;height:9px;border-radius:50%;flex:none}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>捆绑商品 · 待人工拆分</h1>
  <p class="sub">采集时自动识别出的捆绑混卖商品（同一选项维度里混了不同物件）。点「手动拆分」把变体分组并分配 gallery 图片：同一组 = 合并成一个商品（价格按组内各件合计，同款多花色算一件取最高价）；不同组 = 拆分成多个商品；未分配 = 该件不发布。尺码与价格取自 1688 页面（采集中已保存，可点「刷新尺码/价格」重取）。方案保存在采集器。</p>
  <div class="stats" id="stats"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="list"><div class="empty">加载中…</div></main>
<script>
const SIZE_NAME_RE = /(尺码|尺寸|码数|size)/i;
const ONE_SIZE_RE = /(均码|one\s*size|free\s*size)/i;
let DATA = [];
const ITEM = new Map();
const SPLIT = new Map();
const OPEN = new Set();
const GROUP_COLORS = ['#b42318', '#175cd3', '#067647', '#b54708', '#6941c6', '#0e7090'];
let tab = 'all';
let hideSmall = false;
let keyword = '';

function esc(s){return String(s).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function imgFallback(el){
  const fb = el.getAttribute('data-fallback');
  if (fb && el.src !== fb) { el.removeAttribute('data-fallback'); el.src = fb; return; }
  const box = document.createElement('div'); box.className='ph'; box.textContent='无图';
  el.replaceWith(box);
}
function optionChip(o){
  if (o.local || o.source) {
    const src = o.local || o.source;
    const fallback = o.local && o.source ? o.source : '';
    return '<span class="opt"><img loading="lazy" referrerpolicy="no-referrer" src="' + src + '"' + (fallback ? ' data-fallback="' + fallback + '"' : '') + ' onerror="imgFallback(this)" alt=""><span>' + esc(o.text) + '</span></span>';
  }
  return '<span class="chip">' + esc(o.text) + '</span>';
}
function dimRow(d){
  return '<div class="dim"><span class="dim-name">' + esc(d.name) + '</span><span class="opts">' + d.options.map(optionChip).join('') + '</span></div>';
}
function sizeCountOf(it){
  const dim = (it.dims || []).find((d) => SIZE_NAME_RE.test(d.name));
  if (!dim) return 0;
  const values = [...new Set(dim.options.map((o) => String(o.text).trim()).filter((t) => t && !ONE_SIZE_RE.test(t)))];
  return values.length;
}
function row(it){
  const saved = Boolean(it.plan);
  const analysis = it.analysis || {};
  const items = Array.isArray(analysis.items) ? analysis.items : [];
  const itemLine = items.length ? items.map((x) => esc(x.key || (x.options && x.options[0]) || '') + (x.price != null ? ' ¥' + x.price : '')).join(' + ') : '';
  return '<article class="row' + (saved ? ' has-plan' : '') + '" id="row-' + it.id + '" data-id="' + it.id + '">'
    + '<div class="meta"><span class="badge bundle">捆绑</span>'
    + '<span class="style">#' + it.id + '</span>'
    + '<span class="muted">' + esc(it.date || '') + (it.offerId ? ' · ' + esc(String(it.offerId).slice(-6)) : '') + '</span>'
    + '<button class="split-toggle" type="button" data-open="' + it.id + '">手动拆分</button>'
    + '<span class="plan-flag">已保存拆分</span></div>'
    + '<div class="body"><div class="title">' + esc(it.title || '') + '</div><div class="dims">' + it.dims.map(dimRow).join('') + '</div></div>'
    + '<div class="side">' + (itemLine ? '<p class="reason">检测到 ' + items.length + ' 件：' + itemLine + '</p>' : '')
    + (analysis.rules ? '<div class="audit">判定：' + (analysis.rules.nameMixing ? '名称混装' : '') + (analysis.rules.nameMixing && analysis.rules.sizeConflict ? ' + ' : '') + (analysis.rules.sizeConflict ? '尺码不一致' : '') + '</div>' : '')
    + (saved && it.planUpdatedAt ? '<div class="audit">方案保存于 ' + esc(new Date(it.planUpdatedAt).toLocaleString()) + '</div>' : '')
    + '</div></article>';
}

function groupColor(st, gid){return GROUP_COLORS[Math.max(0, st.groups.findIndex((g) => g.id === gid)) % GROUP_COLORS.length];}
function defaultState(){return { groups: [{ id: 'g1', name: '组1' }, { id: 'g2', name: '组2' }], options: {}, images: {}, skuMatrix: null };}
function optionKey(dim, text){return dim + '::' + text;}
function itemKey(text){
  let s = String(text || '');
  s = s.replace(/[A-Za-z]{1,6}[-_]?\d{2,}[A-Za-z0-9-]*/g, ' ');
  s = s.replace(/\d+(?:\.\d+)?/g, ' ');
  s = s.replace(/(白色|白底|米白|奶白|黑色|红色|黄色|绿色|蓝色|粉色|橘色|橙色|咖色|棕色|紫色|灰色|浅蓝|深蓝|浅绿|深绿|银色|金色|彩色|花色|纯色|拼色|条纹|格子|格纹|豹纹|波点|碎花|印花|蕾丝|渐变|牛仔|晕染|扎染|民族风|腰果花|腰果|烫钻|珍珠|亮片|流苏|网纱|雪纺|假两件|钻带|银|金|白|黑|红|黄|绿|蓝|粉|橘|橙|咖|棕|紫|灰)/g, ' ');
  s = s.replace(/(均码|one\s*size|free\s*size)/ig, ' ');
  s = s.replace(/[\s\-_/、,，+]+/g, '');
  return s || String(text || '').trim();
}
function defaultStateFor(it){
  const st = defaultState();
  for (const dim of (it && it.dims) || []) {
    if (SIZE_NAME_RE.test(dim.name)) continue;
    for (const option of dim.options) st.options[optionKey(dim.name, option.text)] = 'g1';
  }
  for (const image of (it && it.gallery) || []) st.images[image.id] = ['g1'];
  if (it && it.skuMatrix) st.skuMatrix = it.skuMatrix;
  return st;
}
function normalizePlan(plan){
  const groups = Array.isArray(plan.groups) && plan.groups.length
    ? plan.groups.map((g, i) => ({ id: String(g.id || ('g' + (i + 1))), name: String(g.name || '') }))
    : defaultState().groups;
  return { groups, options: { ...(plan.options || {}) }, images: { ...(plan.images || {}) }, skuMatrix: plan.skuMatrix || null };
}
function markFlag(id, on){
  const rowEl = document.getElementById('row-' + id);
  if (rowEl) rowEl.classList.toggle('has-plan', on);
}
function groupChips(id, st){
  return st.groups.map((g) => {
    const color = groupColor(st, g.id);
    return '<span class="group-chip"><span class="dot" style="background:' + color + '"></span>'
      + '<input class="gname" data-id="' + id + '" data-gid="' + g.id + '" value="' + esc(g.name) + '" title="组名">'
      + (st.groups.length > 1 ? '<button type="button" data-remove-group="' + g.id + '" data-id="' + id + '" title="删除该组">×</button>' : '')
      + '</span>';
  }).join('');
}
function assignButtons(kind, dataId, key, st, activeList){
  return st.groups.map((g, i) => {
    const active = activeList.includes(g.id);
    const color = groupColor(st, g.id);
    const style = active ? ' style="background:' + color + ';border-color:' + color + ';color:#fff"' : '';
    return '<button type="button" data-kind="' + kind + '" data-id="' + dataId + '" data-key="' + esc(key) + '" data-gid="' + g.id + '"' + style + '>' + (i + 1) + '</button>';
  }).join('');
}
function optionSizes(st, text){
  const sizes = new Set();
  if (st && st.skuMatrix) {
    for (const row of st.skuMatrix.rows || []) {
      const values = Object.values(row.options || {});
      if (!values.includes(text)) continue;
      const sizeValues = Object.entries(row.options || {}).filter(([name]) => SIZE_NAME_RE.test(name)).map(([, value]) => value);
      (sizeValues.length ? sizeValues : values.filter((value) => value !== text)).forEach((value) => sizes.add(value));
    }
  }
  return [...sizes];
}
function optionMaxPrice(st, text){
  let max = null;
  if (st && st.skuMatrix) {
    for (const row of st.skuMatrix.rows || []) {
      if (!Object.values(row.options || {}).includes(text)) continue;
      const price = Number(row.price);
      if (Number.isFinite(price)) max = max == null ? price : Math.max(max, price);
    }
  }
  return max;
}
function groupSummary(id, gid){
  const it = ITEM.get(String(id));
  const st = SPLIT.get(String(id));
  const sizes = new Set();
  const items = new Map();
  if (it && st) {
    for (const dim of it.dims) {
      if (SIZE_NAME_RE.test(dim.name)) continue;
      for (const option of dim.options) {
        if (st.options[optionKey(dim.name, option.text)] !== gid) continue;
        optionSizes(st, option.text).forEach((value) => sizes.add(value));
        const key = itemKey(option.text) || option.text;
        const price = optionMaxPrice(st, option.text);
        const prev = items.get(key);
        if (!prev) items.set(key, { label: key, price });
        else if (price != null && (prev.price == null || price > prev.price)) prev.price = price;
      }
    }
  }
  const priced = [...items.values()].filter((item) => item.price != null);
  const total = priced.reduce((sum, item) => sum + item.price, 0);
  return { sizes: [...sizes], items: priced, total: priced.length ? total : null };
}
function renderEditorBody(id){
  const it = ITEM.get(String(id));
  const st = SPLIT.get(String(id));
  if (!it || !st) return;
  const groupsEl = document.getElementById('groups-' + id);
  if (groupsEl) groupsEl.innerHTML = groupChips(id, st);
  const summaryEl = document.getElementById('gsum-' + id);
  if (summaryEl) {
    summaryEl.innerHTML = st.groups.map((g, i) => {
      const summary = groupSummary(id, g.id);
      const color = groupColor(st, g.id);
      const priceText = summary.total == null ? '' : (summary.items.length > 1
        ? ' · 合计 ¥' + summary.total + '（' + summary.items.map((item) => esc(item.label) + ' ' + item.price).join(' + ') + '）'
        : ' · 参考价 ¥' + summary.items[0].price);
      return '<div class="gsum-line"><span class="dot" style="background:' + color + '"></span><b>' + esc(g.name || ('组' + (i + 1))) + '</b>'
        + (summary.sizes.length ? ' · 尺码 ' + esc(summary.sizes.join(' / ')) : (st.skuMatrix ? ' · 无尺码' : ''))
        + priceText + '</div>';
    }).join('');
  }
  const optsEl = document.getElementById('opts-' + id);
  if (optsEl) {
    const dims = it.dims.filter((dim) => !SIZE_NAME_RE.test(dim.name));
    optsEl.innerHTML = dims.length ? dims.map((dim) => dim.options.map((option) => {
      const key = optionKey(dim.name, option.text);
      const img = option.local || option.source;
      const sizes = optionSizes(st, option.text);
      return '<div class="ed-item">' + (img ? '<img src="' + img + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : '')
        + '<span class="nm">' + esc(dim.name) + '｜' + esc(option.text) + (sizes.length ? ' <i class="sz">' + esc(sizes.join('/')) + '</i>' : '') + '</span>'
        + '<span class="assign">' + assignButtons('opt', id, key, st, st.options[key] ? [st.options[key]] : []) + '</span></div>';
    }).join('')).join('') : '<div class="muted">（无可分组的变体选项）</div>';
  }
  const imgsEl = document.getElementById('imgs-' + id);
  if (imgsEl) {
    imgsEl.innerHTML = (it.gallery || []).length ? it.gallery.map((im) => {
      const assigned = st.images[im.id] || [];
      return '<div class="img-cell"><img src="' + im.thumb + '" loading="lazy" referrerpolicy="no-referrer" onerror="imgFallback(this)" data-fallback="">'
        + '<div class="assign">' + assignButtons('img', id, im.id, st, assigned) + '</div>'
        + '<div class="cap">' + im.type + ' #' + im.id + '</div></div>';
    }).join('') : '<div class="muted">（无 gallery 图片）</div>';
  }
}
async function attachEditor(id){
  const it = ITEM.get(String(id));
  if (!it) return;
  const rowEl = document.getElementById('row-' + id);
  if (!rowEl || document.getElementById('editor-' + id)) return;
  const sec = document.createElement('section');
  sec.className = 'editor';
  sec.id = 'editor-' + id;
  sec.innerHTML =
    '<div class="ed-head"><b>#' + id + ' · 手动拆分</b>'
    + '<span class="groups" id="groups-' + id + '"></span>'
    + '<button type="button" data-add-group="' + id + '">+ 添加组</button>'
    + '<button type="button" data-fetch-matrix="' + id + '">刷新尺码/价格</button>'
    + '<button type="button" data-save="' + id + '">保存</button>'
    + '<button type="button" data-clear="' + id + '">清除已保存</button>'
    + '<button type="button" data-close="' + id + '">收起</button>'
    + '<span class="ed-status" id="mx-' + id + '"></span>'
    + '<span class="ed-status" id="st-' + id + '">未保存修改</span></div>'
    + '<div class="hint">同一组 = 合并成一个商品（价格按组内各件合计）；不同组 = 拆分成多个商品；未分配 = 该件不发布。尺码与价格取自 1688 页面。</div>'
    + '<div class="gsum" id="gsum-' + id + '"></div>'
    + '<div class="ed-cols">'
    + '<div><div class="ed-title">变体选项：每个选项归入一个组</div><div id="opts-' + id + '"></div></div>'
    + '<div><div class="ed-title">Gallery 图片：可同时归入多个组（点数字切换）</div><div class="imgs-grid" id="imgs-' + id + '"></div></div>'
    + '</div>';
  rowEl.insertAdjacentElement('afterend', sec);
  const st = SPLIT.get(String(id)) || defaultStateFor(it);
  SPLIT.set(String(id), st);
  renderEditorBody(String(id));
  if (st.skuMatrix) {
    const mxEl = document.getElementById('mx-' + id);
    if (mxEl) mxEl.textContent = '尺码/价格来源：1688 页面（' + new Date(st.skuMatrix.fetchedAt || Date.now()).toLocaleString() + '）';
  } else {
    fetchMatrix(String(id));
  }
}
function toggleEditor(id){
  const existing = document.getElementById('editor-' + id);
  if (existing) { existing.remove(); OPEN.delete(String(id)); return; }
  OPEN.add(String(id));
  attachEditor(String(id));
}
function closeEditor(id){
  const existing = document.getElementById('editor-' + id);
  if (existing) existing.remove();
  OPEN.delete(String(id));
}
async function fetchMatrix(id){
  const st = SPLIT.get(String(id));
  if (!st) return;
  const mxEl = document.getElementById('mx-' + id);
  if (mxEl) mxEl.textContent = '正在从 1688 获取尺码/价格…（约 10 秒）';
  try {
    const res = await fetch('/api/product-details/' + id + '/dom-sku-matrix', { method: 'POST' });
    if (!res.ok) { if (mxEl) mxEl.textContent = '获取失败 HTTP ' + res.status; return; }
    const data = await res.json();
    if (data && data.matrix) {
      st.skuMatrix = { fetchedAt: data.fetchedAt, dimensions: data.matrix.dimensions, rows: data.matrix.rows, priceScale: data.matrix.priceScale || '' };
      if (mxEl) mxEl.textContent = '尺码/价格来源：1688 页面（' + new Date(data.fetchedAt).toLocaleString() + '）';
      renderEditorBody(String(id));
    } else if (mxEl) {
      mxEl.textContent = '未获取到 SKU 数据';
    }
  } catch (e) { if (mxEl) mxEl.textContent = '获取失败：' + String((e && e.message) || e); }
}
async function savePlan(id){
  const st = SPLIT.get(String(id));
  const stEl = document.getElementById('st-' + id);
  if (!st || !stEl) return;
  stEl.textContent = '保存中…';
  try {
    const res = await fetch('/api/product-details/' + id + '/split-plan', {
      method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ plan: st }),
    });
    if (res.ok) {
      const data = await res.json();
      stEl.textContent = '已保存 ' + new Date(data.updatedAt).toLocaleString();
      const item = ITEM.get(String(id));
      if (item) { item.plan = data.plan || st; item.planUpdatedAt = data.updatedAt; }
      markFlag(id, true);
      renderStats();
    } else {
      stEl.textContent = '保存失败 HTTP ' + res.status;
    }
  } catch (e) { stEl.textContent = '保存失败：' + String((e && e.message) || e); }
}
async function clearPlan(id){
  if (!window.confirm('清除该商品已保存的拆分方案？')) return;
  try {
    const res = await fetch('/api/product-details/' + id + '/split-plan', { method: 'DELETE' });
    if (res.ok) {
      const item = ITEM.get(String(id));
      if (item) { item.plan = null; item.planUpdatedAt = null; }
      SPLIT.set(String(id), defaultStateFor(ITEM.get(String(id))));
      const stEl = document.getElementById('st-' + id);
      if (stEl) stEl.textContent = '已清除，未保存修改';
      markFlag(id, false);
      renderEditorBody(String(id));
      renderStats();
    }
  } catch { /* ignore */ }
}
function handleAssign(kind, id, key, gid){
  const st = SPLIT.get(String(id));
  if (!st) return;
  if (kind === 'opt') {
    if (st.options[key] === gid) delete st.options[key]; else st.options[key] = gid;
  } else {
    const list = new Set(st.images[key] || []);
    if (list.has(gid)) list.delete(gid); else list.add(gid);
    if (list.size) st.images[key] = [...list]; else delete st.images[key];
  }
  renderEditorBody(String(id));
  const stEl = document.getElementById('st-' + id);
  if (stEl) stEl.textContent = '有未保存修改';
}
document.addEventListener('click', (e) => {
  const open = e.target.closest('.split-toggle');
  if (open) { toggleEditor(String(open.dataset.open)); return; }
  const assign = e.target.closest('button[data-kind]');
  if (assign) { handleAssign(assign.dataset.kind, assign.dataset.id, assign.dataset.key, assign.dataset.gid); return; }
  const add = e.target.closest('button[data-add-group]');
  if (add) {
    const id = String(add.dataset.addGroup);
    const st = SPLIT.get(id); if (!st || st.groups.length >= 6) return;
    let n = st.groups.length + 1;
    while (st.groups.some((g) => g.id === 'g' + n)) n += 1;
    st.groups.push({ id: 'g' + n, name: '组' + n });
    renderEditorBody(id);
    return;
  }
  const rm = e.target.closest('button[data-remove-group]');
  if (rm) {
    const id = String(rm.dataset.id);
    const gid = rm.dataset.removeGroup;
    const st = SPLIT.get(id); if (!st || st.groups.length <= 1) return;
    st.groups = st.groups.filter((g) => g.id !== gid);
    for (const [k, v] of Object.entries(st.options)) if (v === gid) delete st.options[k];
    for (const [k, list] of Object.entries(st.images)) {
      const next = list.filter((x) => x !== gid);
      if (next.length) st.images[k] = next; else delete st.images[k];
    }
    renderEditorBody(id);
    return;
  }
  const fetchMx = e.target.closest('button[data-fetch-matrix]');
  if (fetchMx) { fetchMatrix(String(fetchMx.dataset.fetchMatrix)); return; }
  const save = e.target.closest('button[data-save]');
  if (save) { savePlan(String(save.dataset.save)); return; }
  const clear = e.target.closest('button[data-clear]');
  if (clear) { clearPlan(String(clear.dataset.clear)); return; }
  const close = e.target.closest('button[data-close]');
  if (close) { closeEditor(String(close.dataset.close)); return; }
});
document.addEventListener('input', (e) => {
  const input = e.target.closest('input.gname');
  if (!input) return;
  const st = SPLIT.get(String(input.dataset.id));
  if (!st) return;
  const group = st.groups.find((g) => g.id === input.dataset.gid);
  if (group) group.name = input.value;
  const stEl = document.getElementById('st-' + input.dataset.id);
  if (stEl) stEl.textContent = '有未保存修改';
});
function passes(it){
  if (keyword && !String(it.title || '').toLowerCase().includes(keyword)) return false;
  const saved = Boolean(it.plan);
  if (tab === 'saved' && !saved) return false;
  if (tab === 'unsaved' && saved) return false;
  if (hideSmall && sizeCountOf(it) < 3) return false;
  return true;
}
function renderStats(){
  const total = DATA.length;
  const saved = DATA.filter((it) => it.plan).length;
  const el = document.getElementById('stats');
  if (el) el.innerHTML = '<span class="b">待拆分 <b>' + total + '</b></span><span class="n">已保存方案 <b>' + saved + '</b></span><span>未保存 <b>' + (total - saved) + '</b></span>';
}
function render(){
  const list = document.getElementById('list');
  const items = DATA.filter(passes);
  list.innerHTML = items.length ? items.map(row).join('') : '<div class="empty">没有符合条件的产品</div>';
  document.querySelectorAll('#tabs button[data-f]').forEach((b) => b.classList.toggle('on', b.dataset.f === tab));
  const toggleBtn = document.getElementById('sizeToggle');
  if (toggleBtn) {
    toggleBtn.classList.toggle('on', hideSmall);
    toggleBtn.textContent = hideSmall ? '已隐藏尺码<3（均码不算）· 恢复' : '隐藏尺码<3（均码不算）';
  }
  const visible = new Set(items.map((x) => String(x.id)));
  for (const id of [...OPEN]) {
    if (visible.has(id)) attachEditor(id); else closeEditor(id);
  }
}
function wireTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = [['all', '全部'], ['unsaved', '未保存方案'], ['saved', '已保存方案']].map(([f, label]) => {
    const n = f === 'all' ? DATA.length : DATA.filter((it) => (f === 'saved' ? Boolean(it.plan) : !it.plan)).length;
    return '<button type="button" data-f="' + f + '">' + label + ' ' + n + '</button>';
  }).join('')
    + '<button id="sizeToggle" type="button" title="尺码数少于 3 个的商品将被隐藏；均码不计入尺码数"></button>'
    + '<input id="search" type="search" placeholder="搜索标题…">';
  tabsEl.addEventListener('click', (e) => {
    const f = e.target.closest('button[data-f]');
    if (f) { tab = f.dataset.f; render(); return; }
    if (e.target.closest('#sizeToggle')) { hideSmall = !hideSmall; render(); }
  });
  tabsEl.addEventListener('input', (e) => {
    if (e.target.id !== 'search') return;
    keyword = String(e.target.value || '').trim().toLowerCase();
    render();
  });
}
(async () => {
  try {
    const res = await fetch('/api/bundle-inbox?limit=300', { headers: { accept: 'application/json' } });
    const body = await res.json();
    DATA = Array.isArray(body.items) ? body.items : [];
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="empty">加载失败：' + esc(String((e && e.message) || e)) + '</div>';
    return;
  }
  for (const item of DATA) {
    ITEM.set(String(item.id), item);
    const state = item.plan ? normalizePlan(item.plan) : defaultStateFor(item);
    if (!state.skuMatrix && item.skuMatrix) state.skuMatrix = item.skuMatrix;
    SPLIT.set(String(item.id), state);
  }
  wireTabs();
  renderStats();
  render();
})();
</script>
</body>
