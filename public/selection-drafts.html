<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Selection · Hongxiu Collector</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e4e7ec;--text:#1d2939;--muted:#667085;--blue:#175cd3;--green:#067647;--red:#b42318;--orange:#b54708}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{font-size:19px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}
nav a{color:var(--muted);margin-left:14px;text-decoration:none}nav a.on{color:var(--blue);font-weight:700}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding:18px 24px 40px;max-width:1600px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}.list{padding:10px;height:calc(100vh - 150px);overflow:auto;position:sticky;top:16px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px}.draft-item{width:100%;display:block;text-align:left;border:0;background:transparent;border-radius:7px;padding:9px;cursor:pointer;margin-bottom:3px}.draft-item:hover{background:#f2f8ff}.draft-item.on{background:#eaf3ff}.draft-item strong{display:block;font-size:12.5px}.draft-item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.editor{padding:18px;min-width:0}.editor-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}.editor-head h2{margin:0;font-size:20px}.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;background:#eef2f6;color:#475467}.badge.ok{background:#e7f6ec;color:var(--green)}.badge.warn{background:#fff4e8;color:var(--orange)}.badge.err{background:#fef3f2;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.field{display:grid;gap:5px}.field span{font-size:12px;color:var(--muted);font-weight:600}.field input,.field textarea,.field select{width:100%;border:1px solid #d8dce1;border-radius:7px;padding:8px 9px;background:#fff;color:var(--text);font:inherit}.field textarea{min-height:86px;resize:vertical}
.section{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.section h3{margin:0 0 4px;font-size:15px}.hint{font-size:11.5px;color:var(--muted);margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted)}td input{width:100%;border:1px solid #d8dce1;border-radius:5px;padding:5px;font:inherit;min-width:55px}.mini{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 7px;cursor:pointer}.danger{color:var(--red)}.media-row{display:grid;grid-template-columns:1fr 80px 110px;gap:8px;align-items:center;margin-bottom:6px}.media-row img{width:72px;height:54px;object-fit:cover;border:1px solid var(--line);border-radius:5px;background:#f5f6f8}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button,.add-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 13px;cursor:pointer;font:inherit}.actions .primary{background:var(--blue);border-color:var(--blue);color:#fff}.actions .publish{background:var(--green);border-color:var(--green);color:#fff}.actions button:disabled{opacity:.5;cursor:default}.msg{margin-top:10px;font-size:12px;white-space:pre-wrap}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}.empty{padding:24px;color:var(--muted);text-align:center}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}.list{height:auto;position:static}.grid{grid-template-columns:1fr}.media-row{grid-template-columns:1fr 70px}.media-row img{width:64px;height:48px}}
</style>
</head>
<body>
<header>
  <div><h1>Portal Selection</h1><div class="sub">只显示从“全部产品”手动加入的候选；编辑只修改草稿，不改采集数据 / WordPress。</div></div>
  <nav><a href="/products">全部产品</a><a href="/selection" class="on">Selection</a><a href="/dashboard">控制台</a></nav>
</header>
<div class="layout">
  <aside class="card list">
    <input class="search" id="search" placeholder="搜索款式、标题或店铺">
    <div id="draftList"><div class="empty">加载中…</div></div>
  </aside>
  <main class="card editor" id="editor"><div class="empty">从“全部产品”加入一个产品后开始编辑。</div></main>
</div>
<script>
let drafts = [];
let activeId = new URLSearchParams(location.search).get('draft') || '';
let current = null;
let message = '';
let error = '';

function esc(value){return String(value ?? '').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(value){return value === '' || value === null || value === undefined ? null : Number(value);}
function draftOf(row){return row?.draft_payload || {};}
function sourceOf(row){return row?.source_payload || {};}
function statusClass(status){return status === 'PUBLISHED' ? 'ok' : status === 'ERROR' ? 'err' : status ? 'warn' : '';}
function statusLabel(status){return status === 'PUBLISHED' ? '已发布 Portal' : status === 'ERROR' ? '发布失败' : status ? '草稿' : '未加入';}
function currentDraftList(){const q=document.getElementById('search').value.trim().toLowerCase();return drafts.filter((row)=>{if(!q)return true;const d=draftOf(row);return [d.styleNumber,d.title,row.shop_name,row.offer_id].some((v)=>String(v||'').toLowerCase().includes(q));});}
function renderList(){
  const list=document.getElementById('draftList'); const rows=currentDraftList();
  list.innerHTML=rows.length?rows.map((row)=>{const d=draftOf(row);return '<button type="button" class="draft-item'+(String(row.product_detail_id)===String(activeId)?' on':'')+'" data-id="'+esc(row.product_detail_id)+'"><strong>'+esc(d.styleNumber||('#'+row.product_detail_id))+' · '+esc(d.title||row.source_title||'')+'</strong><small>'+esc(row.shop_name||'未知店铺')+' · '+statusLabel(row.status)+(row.portal_product_id?' · Portal '+esc(row.portal_product_id):'')+(row.last_error?' · '+esc(String(row.last_error).slice(0,45)):'')+'</small></button>';}).join(''):'<div class="empty">还没有加入 selection 的产品</div>';
}
async function load(){
  const response=await fetch('/api/selection/drafts?limit=300',{headers:{accept:'application/json'}});
  if(!response.ok) throw new Error('HTTP '+response.status);
  const body=await response.json(); drafts=body.items||[];
  if(!activeId && drafts[0]) activeId=String(drafts[0].product_detail_id);
  await openDraft(activeId, false);
  renderList();
}
async function openDraft(id, push=true){
  activeId=String(id||'');
  current=drafts.find((row)=>String(row.product_detail_id)===String(activeId)) || null;
  if(!current && activeId){
    const response=await fetch('/api/selection/drafts/'+encodeURIComponent(activeId),{headers:{accept:'application/json'}});
    if(response.ok) current=(await response.json()).draft;
  }
  message=''; error='';
  renderEditor();
  renderList();
  if(push && activeId){history.replaceState(null,'','/selection?draft='+encodeURIComponent(activeId));}
}
function renderEditor(){
  const editor=document.getElementById('editor');
  if(!current){editor.innerHTML='<div class="empty">从“全部产品”加入一个产品后开始编辑。</div>';return;}
  const d=draftOf(current); const s=sourceOf(current); const media=Array.isArray(d.media)?d.media:[]; const variants=Array.isArray(d.variants)?d.variants:[]; const tiers=Array.isArray(d.priceTiers)?d.priceTiers:[]; const swatches=Array.isArray(d.swatches)?d.swatches:[];
  editor.innerHTML='<div class="editor-head"><div><h2>'+esc(d.title||('产品 #'+current.product_detail_id))+'</h2><div class="hint">'+esc(s.source?.wpUrl||s.sourceUrl||current.source_url||'')+'</div></div><div><span class="badge '+statusClass(current.status)+'">'+statusLabel(current.status)+'</span>'+(current.portal_product_id?' <span class="badge ok">Portal '+esc(current.portal_product_id)+'</span>':'')+'</div></div>'
  +'<div class="grid">'
  +field('Style number','styleNumber',d.styleNumber||'')
  +field('Title','title',d.title||'')
  +field('Category','category',d.category||'')
  +'<label class="field"><span>Tags（逗号分隔）</span><input id="f-tags" value="'+esc((d.tags||[]).join(', '))+'"></label>'
  +'<label class="field wide"><span>Description</span><textarea id="f-description">'+esc(d.description||'')+'</textarea></label>'
  +field('Price min','priceMin',d.priceMin??'')
  +field('Price max','priceMax',d.priceMax??'')
  +field('MOQ','moq',d.moq??'')
  +field('Currency','currency',d.currency||'USD')
  +'</div>'
  +'<div class="section"><h3>Price tiers</h3><p class="hint">这些是 Portal 的采购价阶梯，发布后不会被 WP 同步覆盖。</p><table id="tiers"><thead><tr><th>Label</th><th>Min qty</th><th>Max qty</th><th>Unit price</th><th></th></tr></thead><tbody>'+tiers.map((tier,index)=>tierRow(tier,index)).join('')+'</tbody></table><button type="button" class="add-btn" data-add-tier>+ 添加阶梯</button></div>'
  +'<div class="section"><h3>Variants</h3><p class="hint">可修改变体名称、SKU、颜色/尺码、图片和库存；source row key 用于同步时保留历史变体。</p><table id="variants"><thead><tr><th>SKU</th><th>Title</th><th>Color</th><th>Size</th><th>Price</th><th>Stock</th><th>Image URL</th><th></th></tr></thead><tbody>'+variants.map((variant,index)=>variantRow(variant,index)).join('')+'</tbody></table><button type="button" class="add-btn" data-add-variant>+ 添加变体</button></div>'
  +'<div class="section"><h3>Media</h3><p class="hint">图片按顺序发布；取消勾选不会删除原图，但不会在 Portal 前台展示。</p><div id="media">'+media.map((entry,index)=>mediaRow(entry,index)).join('')+'</div><button type="button" class="add-btn" data-add-media>+ 添加图片 URL</button></div>'
  +'<div class="section"><h3>Swatches</h3><p class="hint">颜色值和可选 hex 色值 / 图片。</p><table id="swatches"><thead><tr><th>Value</th><th>Hex</th><th>Image URL</th><th></th></tr></thead><tbody>'+swatches.map((entry,index)=>swatchRow(entry,index)).join('')+'</tbody></table><button type="button" class="add-btn" data-add-swatch>+ 添加 swatch</button></div>'
  +'<div class="actions"><button type="button" class="primary" data-save>保存草稿</button><button type="button" class="publish" data-publish>发布 / 同步到 Portal</button><button type="button" data-reset>恢复源数据</button><button type="button" class="danger" data-remove>从 selection 移除</button></div>'
  +'<div class="msg '+(error?'err':message?'ok':'')+'">'+esc(error||message||'')+'</div>';
  bindEditor();
}
function field(label,id,value){return '<label class="field"><span>'+esc(label)+'</span><input id="f-'+id+'" value="'+esc(value)+'"></label>';}
function tierRow(tier,index){return '<tr data-tier="'+index+'"><td><input data-tier-field="label" value="'+esc(tier.label||'')+'"></td><td><input data-tier-field="minQuantity" type="number" min="1" value="'+esc(tier.minQuantity??1)+'"></td><td><input data-tier-field="maxQuantity" type="number" min="1" value="'+esc(tier.maxQuantity??'')+'"></td><td><input data-tier-field="price" type="number" min="0" step="0.01" value="'+esc(tier.price??'')+'"></td><td><button type="button" class="mini danger" data-remove-tier="'+index+'">删除</button></td></tr>';}
function variantRow(v,index){const option=v.optionValues||{};return '<tr data-variant="'+index+'"><td><input data-variant-field="supplierSku" value="'+esc(v.supplierSku||'')+'"></td><td><input data-variant-field="title" value="'+esc(v.title||'')+'"></td><td><input data-variant-option="Color" value="'+esc(option.Color||'')+'"></td><td><input data-variant-option="Size" value="'+esc(option.Size||'')+'"></td><td><input data-variant-field="sourcePrice" type="number" min="0" step="0.01" value="'+esc(v.sourcePrice??'')+'"></td><td><input data-variant-field="stock" type="number" min="0" step="1" value="'+esc(v.stock??'')+'"></td><td><input data-variant-field="imageUrl" value="'+esc(v.imageUrl||'')+'"></td><td><button type="button" class="mini danger" data-remove-variant="'+index+'">删除</button><input type="hidden" data-variant-field="sourceRowKey" value="'+esc(v.sourceRowKey||'')+'"></td></tr>';}
function mediaRow(entry,index){return '<div class="media-row" data-media-row="'+index+'"><input data-media-field="url" value="'+esc(entry.url||'')+'"><img src="'+esc(entry.url||'')+'" alt=""><span><label><input type="checkbox" data-media-field="visible" '+(entry.visible!==false?'checked':'')+'> 展示</label> <button type="button" class="mini" data-media-up="'+index+'">↑</button><button type="button" class="mini" data-media-down="'+index+'">↓</button><button type="button" class="mini danger" data-remove-media="'+index+'">×</button></span></div>';}
function swatchRow(entry,index){return '<tr data-swatch="'+index+'"><td><input data-swatch-field="value" value="'+esc(entry.value||'')+'"></td><td><input data-swatch-field="color" value="'+esc(entry.color||'')+'"></td><td><input data-swatch-field="imageUrl" value="'+esc(entry.imageUrl||'')+'"></td><td><button type="button" class="mini danger" data-remove-swatch="'+index+'">删除</button></td></tr>';}
function readDraft(){
  const d=JSON.parse(JSON.stringify(current.draft_payload||{}));
  d.styleNumber=document.getElementById('f-styleNumber').value.trim();
  d.title=document.getElementById('f-title').value.trim();
  d.category=document.getElementById('f-category').value.trim()||null;
  d.description=document.getElementById('f-description').value;
  d.tags=document.getElementById('f-tags').value.split(',').map((v)=>v.trim()).filter(Boolean);
  d.priceMin=num(document.getElementById('f-priceMin').value); d.priceMax=num(document.getElementById('f-priceMax').value); d.moq=num(document.getElementById('f-moq').value); d.currency=document.getElementById('f-currency').value.trim().toUpperCase()||'USD';
  d.priceTiers=[...document.querySelectorAll('#tiers tbody tr')].map((row)=>({label:row.querySelector('[data-tier-field=label]').value.trim(),minQuantity:Number(row.querySelector('[data-tier-field=minQuantity]').value),maxQuantity:num(row.querySelector('[data-tier-field=maxQuantity]').value),price:Number(row.querySelector('[data-tier-field=price]').value)}));
  d.variants=[...document.querySelectorAll('#variants tbody tr')].map((row)=>{const get=(name)=>row.querySelector('[data-variant-field='+name+']')?.value??'';const color=row.querySelector('[data-variant-option=Color]')?.value??'';const size=row.querySelector('[data-variant-option=Size]')?.value??'';return {sourceRowKey:get('sourceRowKey')||null,supplierSku:get('supplierSku').trim(),title:get('title').trim(),optionValues:{...(color?{Color:color}:{}),...(size?{Size:size}:{})},imageUrl:get('imageUrl').trim()||null,sourcePrice:num(get('sourcePrice')),stock:num(get('stock')),sortOrder:Number(row.dataset.variant)||0};});
  d.media=[...document.querySelectorAll('[data-media-row]')].map((row,index)=>({url:row.querySelector('[data-media-field=url]').value.trim(),visible:row.querySelector('[data-media-field=visible]').checked,alt:null,sortOrder:index})).filter((entry)=>entry.url);
  d.swatches=[...document.querySelectorAll('#swatches tbody tr')].map((row)=>({value:row.querySelector('[data-swatch-field=value]').value.trim(),color:row.querySelector('[data-swatch-field=color]').value.trim()||null,imageUrl:row.querySelector('[data-swatch-field=imageUrl]').value.trim()||null})).filter((entry)=>entry.value);
  return d;
}
async function saveDraft(){current.draft_payload=readDraft();const response=await fetch('/api/selection/drafts/'+encodeURIComponent(activeId),{method:'PATCH',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({draft:current.draft_payload})});const body=await response.json().catch(()=>null);if(!response.ok)throw new Error(body?.message||body?.error||('HTTP '+response.status));current=body.draft;const index=drafts.findIndex((row)=>String(row.product_detail_id)===String(activeId));if(index>=0)drafts[index]=current;message='草稿已保存。';error='';renderEditor();renderList();}
function bindEditor(){
  const editor=document.getElementById('editor');
  editor.querySelector('[data-save]').onclick=()=>{saveDraft().catch((e)=>{error=String(e.message||e);message='';renderEditor();});};
  editor.querySelector('[data-reset]').onclick=async()=>{if(!confirm('恢复为当前采集源/WP 数据？草稿编辑会丢失。'))return;try{const response=await fetch('/api/selection/drafts/'+encodeURIComponent(activeId)+'/reset',{method:'POST'});const body=await response.json();if(!response.ok)throw new Error(body?.message||body?.error);current=body.draft;const i=drafts.findIndex((row)=>String(row.product_detail_id)===String(activeId));if(i>=0)drafts[i]=current;message='已恢复源数据。';error='';renderEditor();renderList();}catch(e){error=String(e.message||e);renderEditor();}};
  editor.querySelector('[data-remove]').onclick=async()=>{if(!confirm('从 selection 移除这个产品？如果已发布 Portal，会保留 Portal 产品。'))return;try{const response=await fetch('/api/selection/drafts/'+encodeURIComponent(activeId),{method:'DELETE'});const body=await response.json().catch(()=>null);if(!response.ok)throw new Error(body?.message||body?.error);window.location.href='/selection';}catch(e){error=String(e.message||e);renderEditor();}};
  editor.querySelector('[data-publish]').onclick=async()=>{try{await saveDraft();const response=await fetch('/api/selection/drafts/'+encodeURIComponent(activeId)+'/publish',{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({target:'staging'})});const body=await response.json().catch(()=>null);if(!response.ok)throw new Error(body?.message||body?.error||('HTTP '+response.status));current=body.draft;message='已发布到 Portal：'+(body.portal?.productId||'');error='';await load();}catch(e){error=String(e.message||e);message='';renderEditor();}};
  editor.querySelectorAll('[data-add-tier]').forEach((b)=>b.onclick=()=>{const tbody=editor.querySelector('#tiers tbody');tbody.insertAdjacentHTML('beforeend',tierRow({label:'',minQuantity:1,maxQuantity:null,price:0},tbody.children.length));bindRemoval();});
  editor.querySelectorAll('[data-add-variant]').forEach((b)=>b.onclick=()=>{const tbody=editor.querySelector('#variants tbody');tbody.insertAdjacentHTML('beforeend',variantRow({supplierSku:'',title:'',optionValues:{},sourcePrice:null,stock:null,imageUrl:''},tbody.children.length));bindRemoval();});
  editor.querySelectorAll('[data-add-media]').forEach((b)=>b.onclick=()=>{const url=prompt('图片 URL');if(!url)return;const box=editor.querySelector('#media');box.insertAdjacentHTML('beforeend',mediaRow({url,visible:true},box.children.length));bindRemoval();});
  editor.querySelectorAll('[data-add-swatch]').forEach((b)=>b.onclick=()=>{const tbody=editor.querySelector('#swatches tbody');tbody.insertAdjacentHTML('beforeend',swatchRow({value:'',color:'',imageUrl:''},tbody.children.length));bindRemoval();});
  bindRemoval();
}
function bindRemoval(){
  const editor=document.getElementById('editor');
  editor.querySelectorAll('[data-remove-tier],[data-remove-variant],[data-remove-media],[data-remove-swatch]').forEach((button)=>{button.onclick=()=>{const attr=button.dataset.removeTier!==undefined?'remove-tier':button.dataset.removeVariant!==undefined?'remove-variant':button.dataset.removeMedia!==undefined?'remove-media':'remove-swatch';const index=button.getAttribute('data-'+attr);const selector=attr==='remove-tier'?'#tiers tbody tr':attr==='remove-variant'?'#variants tbody tr':attr==='remove-media'?'[data-media-row]':'#swatches tbody tr';const target=editor.querySelectorAll(selector)[Number(index)];if(target)target.remove();};});
  editor.querySelectorAll('[data-media-up],[data-media-down]').forEach((button)=>{button.onclick=()=>{const up=button.hasAttribute('data-media-up');const index=Number(button.getAttribute(up?'data-media-up':'data-media-down'));const rows=[...editor.querySelectorAll('[data-media-row]')];const target=index+(up?-1:1);if(target<0||target>=rows.length)return;const parent=rows[index].parentElement;if(up)parent.insertBefore(rows[index],rows[target]);else parent.insertBefore(rows[target],rows[index]);bindRemoval();};});
}
document.getElementById('draftList').addEventListener('click',(event)=>{const button=event.target.closest('[data-id]');if(button)void openDraft(button.dataset.id);});
document.getElementById('search').addEventListener('input',renderList);
load().catch((error)=>{document.getElementById('draftList').innerHTML='<div class="empty">加载失败：'+esc(error.message)+'</div>';});
</script>
</body>
</html>
