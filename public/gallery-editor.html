<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery 优化 · 已发布产品</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #1f2430; }
  header { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid #e2e5ea; padding: 10px 16px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar input, .toolbar select { padding: 5px 8px; border: 1px solid #c9ced6; border-radius: 6px; font-size: 13px; }
  .toolbar button, .row-actions button { padding: 6px 12px; border: 1px solid #c9ced6; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  .toolbar button:hover, .row-actions button:hover { background: #eef1f5; }
  .toolbar button.primary, .row-actions button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .toolbar button.primary:hover, .row-actions button.primary:hover { background: #1d4ed8; }
  #pageinfo { color: #6b7280; }
  main { padding: 14px 16px 60px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: #fff; border: 1px solid #e2e5ea; border-radius: 10px; padding: 12px 14px; }
  .row-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .style { font-weight: 700; font-size: 15px; }
  .muted { color: #6b7280; font-size: 12px; }
  .row-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .status { font-size: 12px; min-width: 160px; }
  .status.ok { color: #15803d; }
  .status.err { color: #b91c1c; }
  .strip-title { margin: 10px 0 6px; font-size: 12px; font-weight: 600; color: #4b5563; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb { position: relative; width: 108px; }
  .thumb img { width: 108px; height: 108px; object-fit: cover; border-radius: 8px; border: 2px solid transparent; background: #eceff3; cursor: zoom-in; display: block; }
  .thumb.sel img { border-color: #2563eb; }
  .thumb .type { position: absolute; left: 4px; top: 4px; font-size: 10px; background: rgba(17,24,39,.72); color: #fff; padding: 1px 5px; border-radius: 4px; }
  .thumb .wp { position: absolute; right: 4px; top: 4px; font-size: 10px; background: #16a34a; color: #fff; padding: 1px 5px; border-radius: 4px; }
  .thumb.rm img { opacity: .55; }
  .thumb .rm-tag { position: absolute; right: 4px; bottom: 34px; font-size: 10px; background: #6b7280; color: #fff; padding: 1px 5px; border-radius: 4px; }
  .thumb.preview .rm-tag { bottom: 5px; }
  .thumb .num { position: absolute; left: 4px; bottom: 34px; font-size: 11px; background: #2563eb; color: #fff; padding: 1px 6px; border-radius: 4px; }
  .thumb.preview .num { bottom: 5px; }
  .thumb .ctl { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 3px; padding: 3px; background: rgba(17,24,39,.62); border-radius: 0 0 8px 8px; }
  .thumb .ctl button { flex: 1; border: 0; border-radius: 4px; background: rgba(255,255,255,.92); font-size: 11px; padding: 2px 0; cursor: pointer; }
  .thumb .ctl button.on { background: #2563eb; color: #fff; }
  .thumb .ctl button:disabled { opacity: .45; cursor: default; }
  .swatch { width: 108px; text-align: center; font-size: 11px; color: #4b5563; }
  .swatch img { width: 72px; height: 72px; object-fit: cover; border-radius: 50%; border: 1px solid #d7dbe2; cursor: zoom-in; background: #eceff3; }
  .swatch .noimg { width: 72px; height: 72px; border-radius: 50%; background: #eceff3; margin: 0 auto; }
  .swatch-btn { margin-top: 4px; padding: 2px 10px; border: 1px solid #c9ced6; border-radius: 6px; background: #fff; cursor: pointer; font-size: 11px; }
  .swatch-btn:disabled { opacity: .45; cursor: default; }
  #picker { position: fixed; inset: 0; background: rgba(10,12,18,.72); z-index: 90; display: flex; align-items: center; justify-content: center; }
  #picker.hidden { display: none; }
  .picker-card { background: #fff; border-radius: 12px; padding: 14px 16px; width: min(900px, 94vw); max-height: 86vh; overflow: auto; }
  .picker-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .picker-head button { margin-left: auto; }
  .picker-foot { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .picker-foot input { padding: 5px 8px; border: 1px solid #c9ced6; border-radius: 6px; font-size: 13px; flex: 1; }
  #picker-grid .thumb img { cursor: pointer; }
  #picker-grid .thumb.picked img { border-color: #2563eb; }
  .thumb.dragging { opacity: .5; }
  .thumb.drop-before::before, .thumb.drop-after::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 3px; background: #2563eb; border-radius: 2px; z-index: 2;
  }
  .thumb.drop-before::before { left: -5px; }
  .thumb.drop-after::after { right: -5px; }
  .purge-btn { border: 1px solid #fecdca; color: #b42318; background: #fff; }
  .purge-btn:hover { border-color: #f97066; background: #fef3f2; }
  .badge-bundle { font-size: 11px; font-weight: 600; color: #92400e; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 999px; padding: 1px 9px; cursor: help; }
  #purge { position: fixed; inset: 0; background: rgba(10,12,18,.72); z-index: 95; display: flex; align-items: center; justify-content: center; }
  #purge.hidden { display: none; }
  .modal-card { background: #fff; border-radius: 12px; padding: 16px 18px; width: min(560px, 92vw); max-height: 86vh; overflow: auto; font-size: 13px; }
  .modal-card h3 { margin: 0 0 8px; font-size: 15px; }
  .modal-card .row-line { margin: 6px 0; }
  .modal-card .row-line.warn { color: #b45309; }
  .modal-card .row-line.err { color: #b91c1c; }
  .modal-card .ok { color: #15803d; }
  .modal-card select { padding: 4px 6px; border: 1px solid #c9ced6; border-radius: 6px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #lightbox { position: fixed; inset: 0; background: rgba(10,12,18,.86); display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 100; cursor: zoom-out; }
  #lightbox.hidden { display: none; }
  #lightbox img { max-width: 92vw; max-height: 84vh; border-radius: 6px; }
  #lightbox-cap { color: #d9dee7; font-size: 12px; margin-top: 10px; }
  .empty { color: #6b7280; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Gallery 优化工作台（临时）· 按 New Arrivals 排序从锚点款往后</h1>
  <div class="toolbar">
    <label>起点款号 <input id="anchor" value="SWOP288" size="10"></label>
    <label>每页 <select id="limit"><option>10</option><option>20</option><option selected>50</option></select></label>
    <button id="load" class="primary">载入</button>
    <button id="prev">上一页</button>
    <button id="next">下一页</button>
    <span id="pageinfo"></span>
  </div>
</header>
<main id="rows"><div class="empty">载入中…</div></main>
<div id="lightbox" class="hidden"><img id="lightbox-img" alt=""><div id="lightbox-cap"></div></div>
<div id="picker" class="hidden">
  <div class="picker-card">
    <div class="picker-head"><strong>更换色卡图</strong><span id="picker-cap" class="muted"></span><button id="picker-close">关闭</button></div>
    <div class="strip" id="picker-grid"></div>
    <div class="picker-foot">
      <input id="picker-url" placeholder="或粘贴图片 https:// URL（会自动下载入库）">
      <button id="picker-ok" class="primary">确定更换</button>
    </div>
    <div class="muted">从 1688 原图池点选一张（蓝框=已选）或粘贴 URL；保存后点「发布到 WP」生效</div>
  </div>
</div>
<div id="purge" class="hidden"><div class="modal-card" id="purge-card"></div></div>
<script>
const $ = (selector, root = document) => root.querySelector(selector);
const state = { anchor: 'SWOP288', limit: 10, offset: 0, total: 0, items: [] };

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function openLightbox(full, caption) {
  $('#lightbox-img').src = full;
  $('#lightbox-cap').textContent = caption || '';
  $('#lightbox').classList.remove('hidden');
}
$('#lightbox').addEventListener('click', () => $('#lightbox').classList.add('hidden'));
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') $('#lightbox').classList.add('hidden');
});

const TYPE_LABEL = { main: '主图', gallery: '图库', description: '详情图', 'description-web': '详情图·未下载' };

async function api(path, options = {}) {
  const hasBody = Boolean(options.body);
  const response = await fetch(path, {
    ...options,
    headers: hasBody ? { 'content-type': 'application/json' } : {},
    body: hasBody ? JSON.stringify(options.body) : undefined,
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload?.message || payload?.error || `HTTP ${response.status}`);
  return payload;
}

function setStatus(item, text, kind = '') {
  const el = document.querySelector(`[data-status="${item.productDetailId}"]`);
  if (el) { el.textContent = text; el.className = `status ${kind}`; }
}

function orderedSelection(item) {
  const byId = new Map(item.pool.filter((entry) => entry.id != null).map((entry) => [String(entry.id), entry]));
  const picked = item.order.filter((id) => byId.has(String(id)));
  const rest = item.pool.filter((entry) => !picked.includes(String(entry.id)));
  return { picked: picked.map((id) => byId.get(String(id))), rest };
}

function renderRow(item) {
  const { picked, rest } = orderedSelection(item);
  const position = new Map(picked.map((entry, index) => [String(entry.id), index + 1]));
  const poolThumb = (entry) => {
    const id = entry.id == null ? '' : String(entry.id);
    const selected = id && item.order.includes(id);
    const num = selected ? position.get(id) : null;
    return `<div class="thumb ${selected ? 'sel' : ''}${entry.removedReason ? ' rm' : ''}" ${selected ? `draggable="true" data-drag-id="${esc(id)}"` : ''}>
      <img src="${esc(entry.thumb || entry.url)}" data-full="${esc(entry.full || entry.url)}"
           data-cap="${esc((TYPE_LABEL[entry.type] || entry.type) + (entry.url ? ' · ' + entry.url : ''))}">
      <span class="type">${esc(TYPE_LABEL[entry.type] || entry.type)}</span>
      ${entry.inWp ? '<span class="wp">WP</span>' : ''}
      ${entry.removedReason ? `<span class="rm-tag" title="去重已剔除：${esc(entry.removedReason)}">已剔</span>` : ''}
      ${num ? `<span class="num">${num}</span>` : ''}
      <div class="ctl">
        <button data-act="toggle" data-pid="${item.productDetailId}" data-id="${esc(id)}" data-web="${entry.web ? 1 : ''}" data-url="${esc(entry.url || '')}"
                class="${selected ? 'on' : ''}">${selected ? '已选' : '选'}</button>
        <button data-act="left" data-pid="${item.productDetailId}" data-id="${esc(id)}" ${selected && num > 1 ? '' : 'disabled'}>◀</button>
        <button data-act="right" data-pid="${item.productDetailId}" data-id="${esc(id)}" ${selected && num < picked.length ? '' : 'disabled'}>▶</button>
      </div>
    </div>`;
  };
  return `<div class="card" data-row="${item.productDetailId}">
    <div class="row-head">
      <span class="style">${esc(item.styleNo || '—')}</span>
      ${item.bundle ? '<span class="badge-bundle" title="捆绑拆分款（keeper）：图片/色卡请在 /products 拆分面板按款编辑；删除会连带 keeper 与全部兄弟款">捆绑款</span>' : ''}
      <span>${esc(item.title)}</span>
      <span class="muted">${esc((item.publicationDate || '').slice(0, 10))} · #${esc(item.wpPostId)}</span>
      ${item.wpUrl ? `<a class="muted" href="${esc(item.wpUrl)}" target="_blank" rel="noreferrer">WP 页面 ↗</a>` : ''}
      <div class="row-actions">
        <span class="status" data-status="${item.productDetailId}"></span>
        <button data-act="reset" data-pid="${item.productDetailId}" ${item.bundle ? 'disabled title="捆绑款请在拆分面板编辑"' : ''}>恢复默认</button>
        <button data-act="save" data-pid="${item.productDetailId}" ${item.bundle ? 'disabled title="捆绑款请在拆分面板编辑"' : ''}>保存选图</button>
        <button data-act="publish" data-pid="${item.productDetailId}" class="primary">发布到 WP</button>
        <button data-act="purge" data-pid="${item.productDetailId}" class="purge-btn" title="从采集器、WordPress 与 RAG 删除，并禁止后续采集">删除…</button>
      </div>
    </div>
    <div class="strip-title">已发布到 WP 的 Gallery · 实时预览（当前已选 ${picked.length} 张 = 保存+发布后的线上图；线上现有 ${item.wpImages.length} 张，绿 WP=已在线上）</div>
    <div class="strip">${picked.map((entry, index) => `
      <div class="thumb sel preview">
        <img src="${esc(entry.thumb || entry.url)}" data-full="${esc(entry.full || entry.url)}"
          data-cap="${esc((TYPE_LABEL[entry.type] || entry.type) + (entry.url ? ' · ' + entry.url : ''))}">
        <span class="type">${esc(TYPE_LABEL[entry.type] || entry.type)}</span>
        ${entry.inWp ? '<span class="wp">WP</span>' : ''}
        <span class="num">${index + 1}</span>
      </div>`).join('') || '<span class="muted">（未选任何图）</span>'}</div>
    <div class="strip-title">Swatch（颜色名 + 色卡 · 「换图」更换该颜色的色卡，发布后生效）</div>
    <div class="strip">${item.swatches.map((swatch) => `
      <div class="swatch">${swatch.thumb
        ? `<img src="${esc(swatch.thumb)}" data-full="${esc(swatch.full || swatch.thumb)}" data-cap="${esc(swatch.label)}">`
        : '<div class="noimg"></div>'}
        <div>${esc(swatch.label)}${swatch.code ? ` <span class="muted">${esc(swatch.code)}</span>` : ''}</div>
        <button class="swatch-btn" data-act="swatch-pick" data-pid="${item.productDetailId}" data-source="${esc(swatch.source || '')}"
          ${swatch.source && !item.bundle ? '' : 'disabled'}
          title="${item.bundle ? '捆绑款请走拆分面板更换' : (swatch.source ? '更换该颜色的色卡图' : '无法定位颜色源')}">换图</button>
      </div>`).join('') || '<span class="muted">（无）</span>'}</div>
    <div class="strip-title">1688 原图池 · 点缩略图看大图，角标「选/已选」切换，◀ ▶ 或直接拖拽调顺序（蓝框=当前选中，绿 WP=已在 WP 上）</div>
    <div class="strip pool-strip">${picked.map(poolThumb).join('')}${rest.map(poolThumb).join('')}</div>
  </div>`;
}

function render() {
  $('#rows').innerHTML = state.items.map(renderRow).join('') || '<div class="empty">没有产品</div>';
  $('#pageinfo').textContent = state.total
    ? `第 ${state.offset + 1}–${state.offset + state.items.length} 条 / 共 ${state.total} 条（锚点日期 ${String(state.anchorDate || '').slice(0, 10)}）`
    : '';
}

async function load() {
  $('#rows').innerHTML = '<div class="empty">载入中…</div>';
  try {
    const data = await api(`/api/gallery-editor/rows?anchor=${encodeURIComponent(state.anchor)}&limit=${state.limit}&offset=${state.offset}`);
    state.total = data.total || 0;
    state.anchorDate = data.anchorDate;
    state.items = (data.items || []).map((item) => ({ ...item, order: (item.working || []).map(String), dirty: false }));
    render();
  } catch (error) {
    $('#rows').innerHTML = `<div class="empty">载入失败：${esc(error.message)}</div>`;
  }
}

function itemOf(pid) { return state.items.find((entry) => entry.productDetailId === Number(pid)); }

// ---- 删除并清退（与 /products 的删除功能一致：purge-preview → 确认 → purge）----
function showPurge(html) {
  $('#purge-card').innerHTML = html;
  $('#purge').classList.remove('hidden');
}

async function openPurge(item) {
  showPurge(`<h3>删除并清退 #${item.productDetailId}</h3><div class="row-line">正在读取影响范围…</div>`);
  let preview;
  try {
    preview = await api(`/api/product-details/${item.productDetailId}/purge-preview`);
  } catch (error) {
    showPurge(`<h3>删除并清退 #${item.productDetailId}</h3><div class="row-line err">无法读取影响范围：${esc(error.message)}</div>
      <div class="modal-actions"><button data-act="purge-close">关闭</button></div>`);
    return;
  }
  const wpPosts = preview.wp?.posts ?? [];
  const wpList = wpPosts.length
    ? wpPosts.map((post) => `<li>WordPress #${esc(String(post.postId))}（${esc(String(post.role))}，当前 ${esc(String(post.status || '未知'))}）</li>`).join('')
    : '<li>无关联 WordPress 文章</li>';
  const lines = ['<div class="row-line">将在以下系统删除该产品：</div>', `<ul>${wpList}</ul>`];
  if (preview.portal?.portalProductId) {
    lines.push(`<div class="row-line">Portal：${esc(String(preview.portal.portalProductId))}（${esc(String(preview.portal.status || ''))}）将归档移除</div>`);
  }
  if ((preview.shopify ?? []).length) {
    lines.push(`<div class="row-line warn">⚠ Shopify 存在映射（${esc(preview.shopify.map((entry) => entry.store).join('、'))}）：本操作不会删除 Shopify 产品，请手动处理。</div>`);
  }
  if (preview.blocklisted) lines.push('<div class="row-line">该 offer 已在禁止采集名单中。</div>');
  const maintenance = preview.activeJobs?.maintenance ?? [];
  const busyParts = [];
  if (preview.activeJobs?.wordpress) busyParts.push('发布任务');
  if (preview.activeJobs?.pipeline) busyParts.push('流水线任务');
  if (maintenance.length) busyParts.push(maintenance.join('、'));
  const busy = busyParts.length > 0;
  if (busy) lines.push(`<div class="row-line warn">⚠ 有任务进行中（${esc(busyParts.join('、'))}），暂不可清退。</div>`);
  showPurge(`<h3>删除并清退 #${item.productDetailId}${item.styleNo ? ' · ' + esc(item.styleNo) : ''}</h3>
    <div class="row-line">${esc(item.title || '')}</div>
    ${lines.join('')}
    <div class="row-line">WP 处理：<select id="purgeWpMode">
      <option value="trash">移入回收站（可恢复）</option>
      <option value="delete">彻底删除（不可恢复）</option></select></div>
    <div class="row-line"><label><input type="checkbox" id="purgeBlocklist" checked> 加入禁止采集名单（后续扫描与采集自动跳过）</label></div>
    <div class="row-line"><label><input type="checkbox" id="purgePortal" checked> 归档 Portal staging 记录（如有）</label></div>
    <div class="row-line" id="purgeResult"></div>
    <div class="modal-actions">
      <button data-act="purge-close">取消</button>
      <button class="primary" id="purgeConfirm" data-act="purge-confirm" data-pid="${item.productDetailId}" ${busy ? 'disabled' : ''}>确认清退</button>
    </div>`);
}

async function confirmPurge(item) {
  const btn = $('#purgeConfirm');
  const resultEl = $('#purgeResult');
  const wpMode = $('#purgeWpMode')?.value || 'trash';
  const blocklist = !$('#purgeBlocklist') || $('#purgeBlocklist').checked;
  const archivePortal = !$('#purgePortal') || $('#purgePortal').checked;
  if (btn) { btn.disabled = true; btn.textContent = '正在清退…'; }
  try {
    const body = await api(`/api/product-details/${item.productDetailId}/purge`, {
      method: 'POST', body: { wpMode, blocklist, archivePortal },
    });
    const wpCount = (body.wp?.posts ?? []).length;
    if (resultEl) {
      resultEl.innerHTML = `<span class="ok">✔ 已清退：WP ${wpCount} 篇（${wpMode === 'delete' ? '彻底删除' : '回收站'}）`
        + `；Portal ${esc(String(body.portal?.status || '-'))}；RAG ${esc(String(body.rag?.status || '-'))}`
        + `${body.blocked ? '；已加入禁止采集名单' : ''}</span>`;
    }
    setTimeout(() => {
      $('#purge').classList.add('hidden');
      state.items = state.items.filter((entry) => entry.productDetailId !== item.productDetailId);
      if (state.total > 0) state.total -= 1;
      render();
    }, 1600);
  } catch (error) {
    if (resultEl) resultEl.innerHTML = `<span class="err">清退失败：${esc(error.message)}</span>`;
    if (btn) { btn.disabled = false; btn.textContent = '确认清退'; }
  }
}

const pickerState = { item: null, source: '', pick: null };

function openPicker(item, source) {
  pickerState.item = item;
  pickerState.source = source;
  pickerState.pick = null;
  $('#picker-cap').textContent = `${item.styleNo || ''} · ${source}`;
  $('#picker-url').value = '';
  $('#picker-grid').innerHTML = item.pool.map((entry) => `
    <div class="thumb" data-pick-id="${esc(entry.id ?? '')}" data-pick-url="${esc(entry.url || entry.full || '')}" data-pick-full="${esc(entry.full || '')}">
      <img src="${esc(entry.thumb || entry.url)}" alt="">
      <span class="type">${esc(TYPE_LABEL[entry.type] || entry.type)}</span>
    </div>`).join('');
  $('#picker').classList.remove('hidden');
}

$('#picker-grid').addEventListener('click', (event) => {
  const cell = event.target.closest('.thumb');
  if (!cell) return;
  pickerState.pick = {
    id: cell.dataset.pickId || null,
    url: cell.dataset.pickUrl || null,
    full: cell.dataset.pickFull || null,
    thumb: cell.querySelector('img')?.src || null,
  };
  $('#picker-grid').querySelectorAll('.thumb').forEach((el) => el.classList.remove('picked'));
  cell.classList.add('picked');
});
$('#picker-close').addEventListener('click', () => $('#picker').classList.add('hidden'));

// ---- 拖拽调整选中图片顺序（与 ◀ ▶ 并存）----
const dragState = { id: null, pid: null };

function clearDropMarkers() {
  document.querySelectorAll('.drop-before, .drop-after')
    .forEach((el) => el.classList.remove('drop-before', 'drop-after'));
}

function clearDragUi() {
  dragState.id = null;
  dragState.pid = null;
  clearDropMarkers();
  document.querySelectorAll('.thumb.dragging').forEach((el) => el.classList.remove('dragging'));
}

function moveInOrder(order, id, targetId, after) {
  const from = order.indexOf(id);
  if (from < 0) return order;
  const next = order.slice();
  next.splice(from, 1);
  let to = targetId == null ? next.length : next.indexOf(targetId);
  if (to < 0) to = next.length;
  next.splice(after ? to + 1 : to, 0, id);
  return next;
}

document.addEventListener('dragstart', (event) => {
  const thumb = event.target.closest('.thumb[data-drag-id]');
  if (!thumb) return;
  dragState.id = thumb.dataset.dragId;
  dragState.pid = thumb.closest('[data-row]')?.dataset.row || null;
  event.dataTransfer.setData('text/plain', thumb.dataset.dragId);
  event.dataTransfer.effectAllowed = 'move';
  thumb.classList.add('dragging');
});

document.addEventListener('dragover', (event) => {
  if (!dragState.id) return;
  const thumb = event.target.closest('.thumb[data-drag-id]');
  const rowEl = event.target.closest('[data-row]');
  if (!rowEl || rowEl.dataset.row !== dragState.pid) return;
  if (thumb && thumb.dataset.dragId !== dragState.id) {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    const rect = thumb.getBoundingClientRect();
    const before = event.clientX < rect.left + rect.width / 2;
    clearDropMarkers();
    thumb.classList.add(before ? 'drop-before' : 'drop-after');
    return;
  }
  if (!thumb && event.target.closest('.strip.pool-strip')) {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
  }
});

document.addEventListener('drop', (event) => {
  if (!dragState.id) return;
  const rowEl = event.target.closest('[data-row]');
  const item = rowEl && rowEl.dataset.row === dragState.pid ? itemOf(rowEl.dataset.row) : null;
  if (!item) { clearDragUi(); return; }
  const thumb = event.target.closest('.thumb[data-drag-id]');
  const strip = event.target.closest('.strip.pool-strip');
  if (thumb && thumb.dataset.dragId !== dragState.id) {
    event.preventDefault();
    const rect = thumb.getBoundingClientRect();
    const after = event.clientX >= rect.left + rect.width / 2;
    item.order = moveInOrder(item.order, dragState.id, thumb.dataset.dragId, after);
    item.dirty = true;
    clearDragUi();
    render();
  } else if (!thumb && strip) {
    event.preventDefault();
    item.order = moveInOrder(item.order, dragState.id, null, true);
    item.dirty = true;
    clearDragUi();
    render();
  } else {
    clearDragUi();
  }
});

document.addEventListener('dragend', () => clearDragUi());

$('#picker-ok').addEventListener('click', async () => {
  const item = pickerState.item;
  if (!item) return;
  const typedUrl = $('#picker-url').value.trim();
  try {
    $('#picker-cap').textContent = '保存中…';
    let imageId = pickerState.pick?.id || null;
    const url = typedUrl || (!imageId ? pickerState.pick?.url : null) || null;
    if (!imageId && url) {
      // URL-only picks are materialized into a stored image row first so the
      // normalization PATCH can reference a real image id.
      const saved = await api(`/api/product-details/${item.productDetailId}/publish-images/materialize`,
        { method: 'POST', body: { url } });
      imageId = String(saved.imageId);
    }
    if (!imageId) { $('#picker-cap').textContent = '请先点选一张图或粘贴 URL'; return; }
    await api(`/api/product-details/${item.productDetailId}/variant-normalization`, {
      method: 'PATCH', body: { source: pickerState.source, imageId },
    });
    const swatch = item.swatches.find((entry) => entry.source === pickerState.source);
    if (swatch) {
      swatch.thumb = pickerState.pick?.thumb
        || (url ? `/api/image-thumb?url=${encodeURIComponent(url)}&w=160` : swatch.thumb);
      swatch.full = pickerState.pick?.full
        || (url ? `/api/image-thumb?url=${encodeURIComponent(url)}&full=1` : swatch.full);
    }
    $('#picker').classList.add('hidden');
    render();
    setStatus(item, '色卡已更换，点「发布到 WP」生效', 'ok');
  } catch (error) {
    $('#picker-cap').textContent = `失败：${error.message}`;
  }
});

async function saveItem(item) {
  const order = item.order.filter((id) => id != null);
  if (!order.length) throw new Error('至少保留一张图');
  await api(`/api/product-details/${item.productDetailId}/publish-images`, { method: 'PUT', body: { order } });
  item.dirty = false;
}

document.addEventListener('click', async (event) => {
  const img = event.target.closest('img[data-full]');
  if (img) { openLightbox(img.dataset.full, img.dataset.cap); return; }
  const button = event.target.closest('button[data-act]');
  if (!button) return;
  if (button.dataset.act === 'purge-close') { $('#purge').classList.add('hidden'); return; }
  const item = itemOf(button.dataset.pid);
  if (!item) return;
  const act = button.dataset.act;
  try {
    if (act === 'toggle') {
      const id = button.dataset.id;
      if (!id && button.dataset.web) {
        setStatus(item, '下载中…');
        const saved = await api(`/api/product-details/${item.productDetailId}/publish-images/materialize`,
          { method: 'POST', body: { url: button.dataset.url } });
        const entry = item.pool.find((pool) => pool.url === button.dataset.url && pool.web);
        if (entry) { entry.id = String(saved.imageId); entry.web = false; entry.thumb = saved.thumb || entry.thumb; }
        item.order.push(String(saved.imageId));
        item.dirty = true;
      } else if (item.order.includes(id)) {
        item.order = item.order.filter((value) => value !== id);
        item.dirty = true;
      } else {
        item.order.push(id);
        item.dirty = true;
      }
      render();
    } else if (act === 'left' || act === 'right') {
      const id = button.dataset.id;
      const index = item.order.indexOf(id);
      const target = act === 'left' ? index - 1 : index + 1;
      if (index >= 0 && target >= 0 && target < item.order.length) {
        item.order.splice(target, 0, item.order.splice(index, 1)[0]);
        item.dirty = true;
        render();
      }
    } else if (act === 'save') {
      setStatus(item, '保存中…');
      await saveItem(item);
      setStatus(item, '选图已保存', 'ok');
    } else if (act === 'publish') {
      setStatus(item, '同步 WP 中…');
      if (item.dirty) await saveItem(item);
      const result = await api(`/api/product-details/${item.productDetailId}/publish-changes`, { method: 'POST' });
      const wp = result.wp || {};
      setStatus(item, `已发布：${(wp.images ?? []).length} 张（+${wp.imagesAdded ?? 0}/-${wp.imagesRemoved ?? 0}）`, 'ok');
    } else if (act === 'reset') {
      setStatus(item, '重置中…');
      await api(`/api/product-details/${item.productDetailId}/publish-images`, { method: 'PUT', body: { reset: true } });
      await load();
    } else if (act === 'swatch-pick') {
      openPicker(item, button.dataset.source || '');
    } else if (act === 'purge') {
      openPurge(item);
    } else if (act === 'purge-confirm') {
      await confirmPurge(item);
    }
  } catch (error) {
    setStatus(item, `失败：${error.message}`, 'err');
  }
});

$('#load').addEventListener('click', () => {
  state.anchor = $('#anchor').value.trim() || 'SWOP288';
  state.limit = Number($('#limit').value) || 10;
  state.offset = 0;
  load();
});
$('#prev').addEventListener('click', () => {
  state.offset = Math.max(0, state.offset - state.limit);
  load();
});
$('#next').addEventListener('click', () => {
  if (state.offset + state.limit < state.total) { state.offset += state.limit; load(); }
});

load();
</script>
