<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选品 · 已发布到 wearhongxiu</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e4e7ec;--text:#111827;--muted:#6b7280;--info:#175cd3;--good:#067647;--warn:#b54708;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:18px 24px 6px}h1{margin:0 0 6px;font-size:19px}.sub{color:var(--muted);font-size:13px;margin:0 0 8px;max-width:1200px}
.nav{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin:6px 0 2px}
.nav a{color:var(--info);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px}
.nav a:hover{border-color:#98a2b3}.nav a.on{background:var(--text);color:#fff;border-color:var(--text)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:10px 24px;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;background:#fff;color:var(--text);outline:none;min-width:88px}
.filters input[type=number]{width:88px}
.filters .pair{display:flex;gap:4px}
.filters button{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#fff;cursor:pointer;font-size:12.5px}
.filters button:hover{border-color:#98a2b3}
.filters button.primary{background:var(--text);color:#fff;border-color:var(--text)}
.filters .spacer{flex:1}
.summary{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 24px 0;max-width:1600px;margin:0 auto;font-size:13px;color:var(--muted)}
.summary b{color:var(--text)}
.summary .freshness{color:#475467}
.pager{display:flex;gap:8px;align-items:center}
.pager button{border:1px solid var(--line);border-radius:8px;padding:4px 12px;background:#fff;cursor:pointer;font-size:12.5px}
.pager button:disabled{opacity:.45;cursor:default}
.pager input{width:64px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px}
main{display:flex;flex-direction:column;gap:8px;padding:12px 24px 60px;max-width:1600px;margin:0 auto}
.row{display:grid;grid-template-columns:112px minmax(230px,300px) minmax(0,1fr) 250px;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;align-items:start}
.row.bundle{border-left:4px solid var(--warn)}
.cover{width:112px;height:112px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f2f4f7;display:block;cursor:zoom-in}
.meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.meta .style{font-weight:700;font-size:13.5px}
.meta .muted{font-size:12px;color:var(--muted);word-break:break-all}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;margin-right:4px;color:#fff;background:#98a2b3}
.badge.keeper{background:var(--warn)}.badge.delisted{background:#667085}.badge.active{background:var(--good)}
.portal-badge.portal-ok{background:var(--good)}
.portal-badge.portal-none{background:#98a2b3}
.portal-badge.portal-fail{background:var(--danger)}
.portal-panel{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;margin-bottom:12px}
.portal-panel h4{margin:0 0 4px;font-size:12.5px}
.portal-note{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.portal-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.portal-tile{position:relative;width:92px;border:1px solid var(--line);border-radius:8px;padding:3px;background:#fff;cursor:grab}
.portal-tile.dragging{opacity:.4}
.portal-tile.drop-before{box-shadow:-3px 0 0 var(--info)}
.portal-tile.drop-after{box-shadow:3px 0 0 var(--info)}
.portal-tile img{width:84px;height:84px;object-fit:cover;border-radius:5px;display:block;background:#f2f4f7;cursor:zoom-in}
.portal-tile .ord{position:absolute;top:5px;left:5px;background:var(--info);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px;min-width:17px;text-align:center}
.portal-tile input{position:absolute;top:5px;right:5px;margin:0;cursor:pointer;width:17px;height:17px;accent-color:#175cd3}
.portal-tile .kind{position:absolute;left:5px;bottom:27px;background:#475467;color:#fff;font-size:10px;border-radius:4px;padding:0 5px;line-height:15px;opacity:.92}
.portal-tile .moves{display:flex;gap:3px;justify-content:center;margin-top:3px}
.portal-tile .moves button{width:24px;height:20px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:10px;cursor:pointer;padding:0;line-height:1}
.portal-tile:not(.is-on) img{opacity:.35}
.portal-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.portal-actions button.primary{border:1px solid var(--info);background:var(--info);color:#fff;border-radius:8px;padding:5px 14px;font-size:12.5px;cursor:pointer}
.portal-actions button.primary:disabled{opacity:.55;cursor:default}
.portal-msg{font-size:12px;color:var(--muted)}
.portal-msg.error{color:var(--danger)}
.portal-msg.ok{color:var(--good)}
.body{display:flex;flex-direction:column;gap:6px;min-width:0}
.title{font-size:13.5px;font-weight:600;line-height:1.45}
.title a{color:var(--text);text-decoration:none;border-bottom:1px dashed #cbd2dc}
.title a:hover{color:var(--info);border-color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:#fff;font-size:11.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.count{background:#f2f4f7;border-color:#e4e7ec;color:#475467;font-weight:600}
.lbl{font-size:11px;font-weight:700;color:var(--muted);min-width:34px}
.expand{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;align-self:flex-start}
.expand:hover{border-color:#98a2b3}
.media{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:10px}
.media h4{margin:2px 0 6px;font-size:12.5px}
.media .grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.media .grid img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#f2f4f7;cursor:zoom-in;display:block}
.media .empty{color:var(--muted);font-size:12px;padding:6px 0}
.sku-wrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px}
.sku-table{width:100%;border-collapse:collapse;font-size:12px}
.sku-table th,.sku-table td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.sku-table th{position:sticky;top:0;background:#f9fafb;color:var(--muted);font-weight:600;z-index:1}
.sku-table tr:last-child td{border-bottom:none}
.sku-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sku-table .num.zero{color:var(--danger)}
.sku-code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;word-break:break-all}
.sku-color{display:inline-flex;align-items:center;gap:6px}
.sku-color img{width:22px;height:22px;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block;background:#f2f4f7}
.side{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.side .k{color:var(--muted);font-size:11.5px;font-weight:600}
.side .sale{font-size:16px;font-weight:800}
.side .sale.month{font-size:13px;font-weight:700;color:var(--info)}
.side .range{font-weight:600}
.side .line{display:flex;justify-content:space-between;gap:8px}
.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:13.5px}
#lightbox{position:fixed;inset:0;background:rgba(15,23,42,.82);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:94vw;max-height:92vh;border-radius:8px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#lightbox .close{position:absolute;top:16px;right:22px;background:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
.loading{padding:26px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>选品</h1>
  <p class="sub">当前已在 wearhongxiu 发布的产品（未发布/下架不显示）。捆绑产品只显示 keeper。展开每行可查看各 SKU 库存（款号-颜色-尺码）与 WP 已发布图片、1688 详情图，图片可点击看大图。</p>
  <div class="nav">
    <a href="/products">全部产品</a>
    <a href="/selection" class="on">选品</a>
    <a href="/shops">店铺</a>
    <a href="/dashboard">控制台</a>
  </div>
</header>

<div class="filters">
  <label>店铺<select id="shop"><option value="">全部店铺</option></select></label>
  <label>1688 类别<select id="category"><option value="">全部</option></select></label>
  <label>WP 类别<select id="wpCategory"><option value="">全部</option></select></label>
  <label>颜色数量<div class="pair"><input id="colorMin" type="number" min="0" placeholder="最小"><input id="colorMax" type="number" min="0" placeholder="最大"></div></label>
  <label>尺码数量<div class="pair"><input id="sizeMin" type="number" min="0" placeholder="最小"><input id="sizeMax" type="number" min="0" placeholder="最大"></div></label>
  <label>累计销量 ≥<input id="saleMin" type="number" min="0" placeholder="0"></label>
  <label>30 天销量 ≥<input id="monthlyMin" type="number" min="0" placeholder="0"></label>
  <label>价格 CNY<div class="pair"><input id="priceMin" type="number" min="0" placeholder="最低"><input id="priceMax" type="number" min="0" placeholder="最高"></div></label>
  <label>排序<select id="sort">
    <option value="sales">累计销量</option>
    <option value="monthly">30 天销量</option>
    <option value="price">价格</option>
    <option value="listing">上架时间</option>
  </select></label>
  <button id="dir" title="切换升序/降序">降序 ↓</button>
  <label>Portal 状态<select id="portalFilter">
    <option value="">全部</option>
    <option value="none">未发布</option>
    <option value="published">已发布</option>
    <option value="failed">发布失败</option>
  </select></label>
  <label>每页<select id="pageSize"><option>100</option><option>200</option><option>300</option></select></label>
  <span class="spacer"></span>
  <button id="reset">重置</button>
</div>

<div class="summary">
  <span>共 <b id="total">-</b> 个产品</span>
  <span id="range"></span>
  <span id="freshness" class="freshness"></span>
  <div class="pager">
    <button id="prev">上一页</button>
    <span>第 <b id="pageLabel">1</b> / <span id="pageTotal">1</span> 页</span>
    <button id="next">下一页</button>
    <input id="pageJump" type="number" min="1" placeholder="跳页">
  </div>
</div>

<main id="rows"><div class="loading">加载中…</div></main>

<div id="lightbox"><button class="close" aria-label="关闭">×</button><img id="lightboxImg" alt=""></div>

<script>
const state = { page: 1, pageSize: 100, total: 0, dir: 'desc', loading: false };
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtSale = (value) => value == null ? '-' : String(value);

function filterParams() {
  const params = new URLSearchParams();
  const add = (key, value) => { if (value !== '' && value != null) params.set(key, value); };
  add('shop', $('shop').value);
  add('category', $('category').value);
  add('wpCategory', $('wpCategory').value);
  add('colorMin', $('colorMin').value.trim());
  add('colorMax', $('colorMax').value.trim());
  add('sizeMin', $('sizeMin').value.trim());
  add('sizeMax', $('sizeMax').value.trim());
  add('saleMin', $('saleMin').value.trim());
  add('monthlyMin', $('monthlyMin').value.trim());
  add('priceMin', $('priceMin').value.trim());
  add('priceMax', $('priceMax').value.trim());
  add('portal', $('portalFilter').value);
  add('sort', $('sort').value);
  add('dir', state.dir);
  params.set('limit', String(state.pageSize));
  params.set('offset', String((state.page - 1) * state.pageSize));
  return params;
}

async function loadFacets() {
  try {
    const data = await (await fetch('/api/selection/facets')).json();
    const fill = (id, rows, mapper) => { const select = $(id); for (const row of rows) { const option = document.createElement('option'); option.value = mapper(row).value; option.textContent = mapper(row).label; select.appendChild(option); } };
    fill('shop', data.shops || [], (row) => ({ value: row.id ?? '', label: (row.name ?? row.id) + (row.lastScanAt ? ' · ' + String(row.lastScanAt).slice(5, 10) : '') }));
    fill('category', data.categories1688 || [], (value) => ({ value, label: value }));
    fill('wpCategory', data.categoriesWp || [], (value) => ({ value, label: value }));
    const latest = data.lastScanAt ? String(data.lastScanAt).replace('T', ' ').slice(0, 16) : '';
    if (latest) $('freshness').textContent = '数据截至 ' + latest + '（随每日店铺扫描自动更新：销量/类目/上下架/新增与移除）';
  } catch { /* filters stay empty */ }
}

function chips(values, limit = 10) {
  const list = (values || []).filter(Boolean);
  const shown = list.slice(0, limit).map((v) => '<span class="chip">' + esc(v) + '</span>').join('');
  const more = list.length > limit ? '<span class="chip count">+' + (list.length - limit) + '</span>' : '';
  return shown + more;
}

function rowHtml(it) {
  const title = it.wpTitle || ('1688 ' + (it.offerId || ''));
  const portalBadge = it.portalState === 'published'
    ? '<span class="badge portal-badge portal-ok" data-portal-badge="' + esc(it.productDetailId) + '">Portal 已发布' + (it.portalTarget ? ' · ' + esc(it.portalTarget === 'staging' ? 'staging' : 'prod') : '') + '</span>'
    : it.portalState === 'failed'
      ? '<span class="badge portal-badge portal-fail" data-portal-badge="' + esc(it.productDetailId) + '">Portal 失败</span>'
      : '<span class="badge portal-badge portal-none" data-portal-badge="' + esc(it.productDetailId) + '">未发布</span>';
  const badges = [
    it.bundleKeeper ? '<span class="badge keeper">keeper</span>' : '',
    it.availability && it.availability !== 'active' ? '<span class="badge delisted">1688 已下架</span>' : '',
    portalBadge,
  ].join('');
  const sale = it.saleQuantity;
  const monthly = it.thirtyBookCount;
  return '<article class="row' + (it.bundleKeeper ? ' bundle' : '') + '" data-id="' + esc(it.productDetailId) + '">' +
    (it.cover ? '<img class="cover" loading="lazy" src="' + esc(it.cover) + '" alt="" onclick="openLightbox(this.src)">' : '<div class="cover"></div>') +
    '<div class="meta">' +
      '<div class="style">' + esc(it.styleNo || it.offerId) + ' ' + badges + '</div>' +
      '<div class="title"><a href="' + esc(it.wpUrl || '#') + '" target="_blank" rel="noopener">' + esc(title) + '</a></div>' +
      (it.wpCategory ? '<div class="muted">WP 类别：' + esc(it.wpCategory) + '</div>' : '') +
      '<div class="muted">' + esc(it.shopName || '未知店铺') + (it.category ? ' · ' + esc(it.category) : '') + '</div>' +
      '<div class="muted">offer ' + esc(it.offerId || '-') + (it.wpPostId ? ' · WP #' + esc(it.wpPostId) : '') + '</div>' +
    '</div>' +
    '<div class="body">' +
      '<div class="chips"><span class="lbl">颜色</span><span class="chip count">' + it.colorCount + ' 个</span>' + chips(it.colors) + '</div>' +
      '<div class="chips"><span class="lbl">尺码</span><span class="chip count">' + it.sizeCount + ' 个</span>' + chips(it.sizes, 14) + '</div>' +
      '<button class="expand" data-media="' + esc(it.productDetailId) + '">查看图片与库存 ▾</button>' +
      '<div class="media" hidden></div>' +
    '</div>' +
    '<div class="side">' +
      '<div class="k">累计销量</div><div class="sale">' + fmtSale(sale) + '</div>' +
      '<div class="k">近 30 天销量</div><div class="sale month">' + (monthly == null ? '-' : monthly) + '</div>' +
      '<div class="k">1688 价格</div><div class="range">' + (it.priceMin == null ? '-' : (it.priceMin === it.priceMax ? '¥' + it.priceMin : '¥' + it.priceMin + ' ~ ¥' + it.priceMax)) + '</div>' +
      (it.listingTime ? '<div class="k">上架时间</div><div>' + esc(String(it.listingTime).slice(0, 10)) + '</div>' : '') +
    '</div>' +
  '</article>';
}

async function load() {
  if (state.loading) return;
  state.loading = true;
  $('rows').innerHTML = '<div class="loading">加载中…</div>';
  try {
    const data = await (await fetch('/api/selection/products?' + filterParams())).json();
    state.total = data.total || 0;
    const totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
    if (state.page > totalPages) { state.page = totalPages; state.loading = false; return load(); }
    $('total').textContent = state.total;
    $('pageLabel').textContent = state.page;
    $('pageTotal').textContent = totalPages;
    const start = state.total === 0 ? 0 : (state.page - 1) * state.pageSize + 1;
    const end = Math.min(state.page * state.pageSize, state.total);
    $('range').textContent = state.total ? ('显示 ' + start + ' – ' + end) : '';
    $('prev').disabled = state.page <= 1;
    $('next').disabled = state.page >= totalPages;
    $('rows').innerHTML = (data.items || []).map(rowHtml).join('') || '<div class="empty-state">没有符合条件的产品</div>';
  } catch (error) {
    $('rows').innerHTML = '<div class="empty-state">加载失败：' + esc(error.message || error) + '</div>';
  } finally {
    state.loading = false;
  }
}

/* ---- Portal publish: image selection, ordering and sync state ---- */
const portalDrafts = {};
let dragPortalIndex = null;
let dropPortalIndex = null;

function portalDraftFor(id, media) {
  if (portalDrafts[id]) return portalDrafts[id];
  const wp = Array.isArray(media.wpImages) ? media.wpImages : [];
  const detail = Array.isArray(media.detailImages) ? media.detailImages : [];
  const saved = media.portal && Array.isArray(media.portal.images) ? media.portal.images : [];
  const all = [
    ...wp.filter((image) => image.url).map((image) => ({ url: image.url, kind: 'wp' })),
    ...detail.filter((image) => image.url).map((image) => ({ url: image.url, kind: 'detail' })),
  ];
  const available = new Map(all.map((image) => [image.url, image]));
  const images = [];
  for (const entry of saved) {
    if (entry && entry.url && available.has(entry.url)) {
      images.push({ url: entry.url, visible: entry.visible !== false, kind: entry.kind || available.get(entry.url).kind });
      available.delete(entry.url);
    }
  }
  for (const image of all) {
    if (available.has(image.url)) images.push({ url: image.url, visible: true, kind: image.kind });
  }
  portalDrafts[id] = { images, portal: media.portal || null, message: '', error: '', saving: false };
  return portalDrafts[id];
}

function portalPanelHtml(id) {
  const draft = portalDrafts[id];
  if (!draft) return '';
  const portal = draft.portal;
  const targetName = portal && portal.target ? (portal.target === 'staging' ? 'staging' : '生产') : '';
  const stateText = portal && portal.error
    ? '上次发布失败'
    : portal && portal.productId
      ? '已发布' + (targetName ? ' · ' + targetName : '') + ' · ' + esc(portal.status || 'ACTIVE') + (portal.syncedAt ? ' · ' + esc(String(portal.syncedAt).slice(0, 16).replace('T', ' ')) : '')
      : '未发布';
  const selected = draft.images.filter((image) => image.visible).length;
  const tiles = draft.images.map((image, index) =>
    '<div class="portal-tile' + (image.visible ? ' is-on' : '') + '" data-portal-tile="' + index + '">' +
      '<span class="ord">' + (index + 1) + '</span>' +
      (image.kind === 'detail' ? '<span class="kind">详情</span>' : '') +
      '<input type="checkbox" ' + (image.visible ? 'checked' : '') + ' data-portal-toggle="' + index + '" title="勾选后发布到 Portal">' +
      '<img loading="lazy" referrerpolicy="no-referrer" draggable="true" src="' + esc(image.url) + '" alt="" onclick="openLightbox(this.src)" onerror="this.style.opacity=.25">' +
      '<span class="moves"><button type="button" data-portal-move="' + index + '" data-portal-dir="-1" title="前移">◀</button><button type="button" data-portal-move="' + index + '" data-portal-dir="1" title="后移">▶</button></span>' +
    '</div>').join('');
  return '<div class="portal-panel" data-portal-panel="' + esc(id) + '">' +
    '<h4>发布到 Portal <span class="portal-msg">（' + stateText + '）</span></h4>' +
    '<div class="portal-note">勾选要发布到 Portal 的图片（共 ' + draft.images.length + ' 张，已选 ' + selected + ' 张；带「详情」标记的是 1688 详情图，会在发布时自动下载）；拖拽图片或用 ◀ ▶ 调整顺序，顺序即 Portal 客户侧的展示顺序；未勾选的图片不会展示。</div>' +
    (draft.images.length ? '<div class="portal-grid">' + tiles + '</div>' : '<div class="empty">该产品没有可选图片</div>') +
    '<div class="portal-actions">' +
      '<button type="button" class="primary" data-portal-publish="' + esc(id) + '"' + (draft.saving ? ' disabled' : '') + '>' +
        (draft.saving ? '发布中…' : portal && portal.productId ? '更新发布到 Portal' : '发布到 Portal') + '</button>' +
      (draft.message ? '<span class="portal-msg ok">' + esc(draft.message) + '</span>' : '') +
      (draft.error ? '<span class="portal-msg error">' + esc(draft.error) + '</span>' : '') +
    '</div></div>';
}

function refreshPortalSlot(id) {
  const slot = document.querySelector('.row[data-id="' + id + '"] .portal-slot');
  if (slot) slot.innerHTML = portalPanelHtml(id);
}

function updatePortalBadge(id, stateName, label) {
  const badge = document.querySelector('[data-portal-badge="' + id + '"]');
  if (!badge) return;
  if (stateName === 'published') { badge.className = 'badge portal-badge portal-ok'; badge.textContent = 'Portal 已发布' + (label ? ' · ' + label : ''); }
  else if (stateName === 'failed') { badge.className = 'badge portal-badge portal-fail'; badge.textContent = 'Portal 失败'; }
  else { badge.className = 'badge portal-badge portal-none'; badge.textContent = '未发布'; }
}

async function publishPortal(id) {
  const draft = portalDrafts[id];
  if (!draft || draft.saving) return;
  draft.saving = true; draft.message = ''; draft.error = '';
  refreshPortalSlot(id);
  try {
    const response = await fetch('/api/selection/products/' + encodeURIComponent(id) + '/portal-publish', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ images: draft.images.map((image) => ({ url: image.url, visible: image.visible })) }),
    });
    const data = await response.json().catch(() => null);
    if (!response.ok) throw new Error((data && (data.message || data.error)) || ('HTTP ' + response.status));
    if (data.portal && Array.isArray(data.portal.images) && data.portal.images.length) {
      draft.images = data.portal.images.map((entry) => ({ url: entry.url, visible: entry.visible !== false, kind: entry.kind || null }));
    }
    const visibleCount = draft.images.filter((image) => image.visible).length;
    draft.portal = {
      productId: (data.portal && data.portal.productId) || null,
      status: (data.portal && data.portal.status) || null,
      target: (data.portal && data.portal.target) || null,
      error: null,
      syncedAt: new Date().toISOString(),
      images: draft.images.map((image) => ({ url: image.url, visible: image.visible })),
    };
    draft.message = '已发布：展示 ' + visibleCount + ' 张 / 共 ' + draft.images.length + ' 张';
    updatePortalBadge(id, 'published', [draft.portal.target, draft.portal.status].filter(Boolean).join(' · '));
  } catch (error) {
    draft.error = String((error && error.message) || error);
    updatePortalBadge(id, 'failed', null);
  } finally {
    draft.saving = false;
    refreshPortalSlot(id);
  }
}

document.addEventListener('click', (event) => {
  const toggle = event.target.closest('input[data-portal-toggle]');
  if (toggle) {
    const panel = toggle.closest('[data-portal-panel]');
    const id = panel ? panel.dataset.portalPanel : null;
    const draft = id ? portalDrafts[id] : null;
    if (draft) {
      const index = Number(toggle.dataset.portalToggle);
      if (draft.images[index]) draft.images[index].visible = toggle.checked;
      refreshPortalSlot(id);
    }
    return;
  }
  const move = event.target.closest('button[data-portal-move]');
  if (move) {
    const panel = move.closest('[data-portal-panel]');
    const id = panel ? panel.dataset.portalPanel : null;
    const draft = id ? portalDrafts[id] : null;
    if (!draft) return;
    const index = Number(move.dataset.portalMove);
    const next = index + Number(move.dataset.portalDir);
    if (next < 0 || next >= draft.images.length) return;
    const [item] = draft.images.splice(index, 1);
    draft.images.splice(next, 0, item);
    refreshPortalSlot(id);
    return;
  }
  const publish = event.target.closest('button[data-portal-publish]');
  if (publish) { void publishPortal(publish.dataset.portalPublish); }
});

document.addEventListener('dragstart', (event) => {
  const image = event.target.closest('.portal-tile img');
  if (!image) return;
  const tile = image.closest('.portal-tile');
  dragPortalIndex = Number(tile.dataset.portalTile);
  tile.classList.add('dragging');
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', String(dragPortalIndex));
});
document.addEventListener('dragover', (event) => {
  const tile = event.target.closest('.portal-tile');
  if (!tile || dragPortalIndex === null) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  const rect = tile.getBoundingClientRect();
  const after = event.clientX > rect.left + rect.width / 2;
  dropPortalIndex = Number(tile.dataset.portalTile) + (after ? 1 : 0);
  document.querySelectorAll('.portal-tile.drop-before,.portal-tile.drop-after').forEach((el) => el.classList.remove('drop-before', 'drop-after'));
  tile.classList.add(after ? 'drop-after' : 'drop-before');
});
document.addEventListener('drop', (event) => {
  const tile = event.target.closest('.portal-tile');
  if (!tile || dragPortalIndex === null) return;
  event.preventDefault();
  const panel = tile.closest('[data-portal-panel]');
  const id = panel ? panel.dataset.portalPanel : null;
  const draft = id ? portalDrafts[id] : null;
  if (draft && dropPortalIndex !== null) {
    const from = dragPortalIndex;
    let target = dropPortalIndex;
    const [item] = draft.images.splice(from, 1);
    if (target > from) target -= 1;
    target = Math.max(0, Math.min(target, draft.images.length));
    draft.images.splice(target, 0, item);
  }
  dragPortalIndex = null; dropPortalIndex = null;
  if (id) refreshPortalSlot(id);
});
document.addEventListener('dragend', () => {
  dragPortalIndex = null; dropPortalIndex = null;
  document.querySelectorAll('.portal-tile').forEach((el) => el.classList.remove('dragging', 'drop-before', 'drop-after'));
});

async function toggleMedia(button) {
  const row = button.closest('.row');
  const box = row.querySelector('.media');
  const id = button.dataset.media;
  if (!box.hidden) { box.hidden = true; button.textContent = '查看图片与库存 ▾'; return; }
  button.textContent = '收起 ▴';
  box.hidden = false;
  if (box.dataset.loaded) return;
  box.innerHTML = '<div class="empty">加载中…</div>';
  const [mediaResult, skuResult] = await Promise.allSettled([
    fetch('/api/selection/products/' + encodeURIComponent(id) + '/media').then((response) => response.json()),
    fetch('/api/selection/products/' + encodeURIComponent(id) + '/skus').then((response) => response.json()),
  ]);
  let html = '';
  if (skuResult.status === 'fulfilled' && skuResult.value && Array.isArray(skuResult.value.skus)) {
    const data = skuResult.value;
    const skus = data.skus;
    const total = skus.reduce((sum, sku) => sum + (Number(sku.stock) || 0), 0);
    html += '<h4>SKU 库存（' + skus.length + ' 个 · 合计 ' + total + (data.capturedAt ? ' · 采集于 ' + esc(String(data.capturedAt).slice(0, 10)) : '') + '）</h4>';
    html += skus.length
      ? '<div class="sku-wrap"><table class="sku-table"><thead><tr><th>款号</th><th>颜色</th><th>尺码</th><th class="num">库存</th><th class="num">单价</th></tr></thead><tbody>'
        + skus.map((sku) => '<tr>' +
            '<td class="sku-code">' + esc(sku.variantSku || sku.skuKey) + '</td>' +
            '<td><span class="sku-color">' + (sku.image ? '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(sku.image) + '" alt="" onerror="this.style.display=\'none\'">' : '') + esc(sku.color || '-') + '</span></td>' +
            '<td>' + esc(sku.size || '-') + '</td>' +
            '<td class="num' + (sku.stock === 0 ? ' zero' : '') + '">' + (sku.stock === null ? '-' : sku.stock) + '</td>' +
            '<td class="num">' + (sku.price === null ? '-' : '¥' + sku.price) + '</td>' +
          '</tr>').join('')
        + '</tbody></table></div>'
      : '<div class="empty">（无 SKU 数据）</div>';
  } else {
    html += '<h4>SKU 库存</h4><div class="empty">SKU 数据加载失败</div>';
  }
  if (mediaResult.status === 'fulfilled' && mediaResult.value) {
    const data = mediaResult.value;
    const grid = (items) => items.length
      ? '<div class="grid">' + items.map((image) => '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(image.url) + '" alt="' + esc(image.alt || '') + '" onclick="openLightbox(this.dataset.full || this.src)" data-full="' + esc(image.url) + '" onerror="this.style.opacity=.25">').join('') + '</div>'
      : '<div class="empty">（无）</div>';
    html += '<h4>WP 已发布图片（' + data.wpImages.length + '）</h4>' + grid(data.wpImages) +
      '<h4>1688 详情图（' + data.detailImages.length + '，未下载也可预览）</h4>' + grid(data.detailImages);
  } else {
    html += '<h4>图片</h4><div class="empty">图片加载失败</div>';
  }
  box.innerHTML = '<div class="portal-slot"></div>' + html;
  const slot = box.querySelector('.portal-slot');
  if (mediaResult.status === 'fulfilled' && mediaResult.value) {
    portalDraftFor(id, mediaResult.value);
    if (slot) slot.innerHTML = portalPanelHtml(id);
  } else if (slot) {
    slot.innerHTML = '<div class="portal-panel"><h4>发布到 Portal</h4><div class="portal-msg error">图片加载失败，无法选择图片</div></div>';
  }
  box.dataset.loaded = '1';
}

function openLightbox(src) { if (!src) return; $('lightboxImg').src = src; $('lightbox').classList.add('on'); }
function closeLightbox() { $('lightbox').classList.remove('on'); $('lightboxImg').src = ''; }
$('lightbox').addEventListener('click', (event) => { if (event.target === $('lightbox') || event.target.classList.contains('close')) closeLightbox(); });
window.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeLightbox(); });

document.addEventListener('click', (event) => {
  const expand = event.target.closest('button.expand');
  if (expand) void toggleMedia(expand);
});

const rerun = () => { state.page = 1; void load(); };
$('shop').addEventListener('change', rerun);
$('category').addEventListener('change', rerun);
$('wpCategory').addEventListener('change', rerun);
$('portalFilter').addEventListener('change', rerun);
$('sort').addEventListener('change', rerun);
$('pageSize').addEventListener('change', () => { state.pageSize = Number($('pageSize').value) || 100; rerun(); });
$('dir').addEventListener('click', () => { state.dir = state.dir === 'desc' ? 'asc' : 'desc'; $('dir').textContent = state.dir === 'desc' ? '降序 ↓' : '升序 ↑'; rerun(); });
$('prev').addEventListener('click', () => { if (state.page > 1) { state.page -= 1; void load(); } });
$('next').addEventListener('click', () => { state.page += 1; void load(); });
$('pageJump').addEventListener('change', () => { const value = Number($('pageJump').value); if (value >= 1) { state.page = value; void load(); } });
$('reset').addEventListener('click', () => {
  for (const id of ['shop', 'category', 'wpCategory', 'colorMin', 'colorMax', 'sizeMin', 'sizeMax', 'saleMin', 'monthlyMin', 'priceMin', 'priceMax', 'portalFilter']) $(id).value = '';
  $('sort').value = 'sales'; state.dir = 'desc'; $('dir').textContent = '降序 ↓';
  $('pageJump').value = ''; rerun();
});
let debounce = null;
for (const id of ['colorMin', 'colorMax', 'sizeMin', 'sizeMax', 'saleMin', 'monthlyMin', 'priceMin', 'priceMax']) {
  $(id).addEventListener('input', () => { window.clearTimeout(debounce); debounce = window.setTimeout(rerun, 450); });
}

void loadFacets();
void load();
</script>
</body>
